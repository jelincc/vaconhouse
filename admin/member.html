<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/vacon-logo-stacked.svg" type="image/svg+xml">
<title>VACON house 회원 상세</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="admin.css">
<style>
.wrap{max-width:1320px;width:100%;display:flex;flex-direction:column;gap:20px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--ink-3);font-weight:600;font-size:14px;text-decoration:none;align-self:flex-start;margin-left:-4px}
.back svg{width:18px;height:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.head .who{display:flex;align-items:center;gap:16px}
.head .av{width:56px;height:56px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:22px;font-weight:700}
.head h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.head p{margin:4px 0 0;font-size:15px;color:var(--ink-2)}
.head .acts{display:flex;gap:8px}
.head .acts .btn{height:48px;padding:0 22px;border-radius:12px;font-size:15px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.fact{padding:18px 22px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact small{display:block;font-size:13px;color:var(--ink-3);margin-bottom:2px}
.fact b{font-size:17px;font-weight:700}
.fact span{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card > h3 .tbtn{margin-left:auto}
.form{display:grid;grid-template-columns:104px 1fr;gap:10px 12px;align-items:center;font-size:14px}
.form label{color:var(--ink-3)}
.formfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row:last-child{border-bottom:0}
.row small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.segb{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.segb button{border:0;background:transparent;height:32px;padding:0 12px;border-radius:8px;font-weight:600;color:var(--ink-3);font-size:13.5px}
.segb button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.memo{display:flex;flex-direction:column;gap:8px}
.memo .it{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px}
.memo .it small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.memo .add{display:flex;gap:8px}
.mscrim{position:fixed;inset:0;background:rgba(26,26,30,.36);z-index:45;display:grid;place-items:center;padding:16px}
.dlg{background:#fff;border-radius:24px;width:min(440px,100%);box-shadow:var(--shadow);padding:24px}
.dlg h3{margin:0;font-size:20px;font-weight:700}
.dlg p{margin:8px 0 18px;font-size:14.5px;color:var(--ink-2)}
.dlg .f{display:flex;gap:8px}
table{width:100%;border-collapse:collapse}
th{font-size:13px;font-weight:600;color:var(--ink-3);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#FAFBFC}
.panel{border:1px solid var(--line);border-radius:20px;overflow:hidden}
.empty{padding:48px 16px;text-align:center;color:var(--ink-3)}
.empty .tbtn{white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <aside class="side"></aside>
  <main class="main"><div class="wrap" id="wrap"></div></main>
</div>
<script src="data.js"></script>
<script src="cases.js" defer></script>
<script>
mountSide();
const $ = id => document.getElementById(id);
const m = MEMBERS.find(x => x.id === new URLSearchParams(location.search).get('id')) || MEMBERS[0];
let edit = false;
function render(){
  const L = memberRes(m).sort((a, b) => b.in - a.in), act = L.filter(ACTIVE);
  const up = act.filter(r => r.out >= 0).sort((a, b) => a.in - b.in)[0];
  const paid = act.reduce((a, r) => a + price(r).sub, 0);
  const stop = m.status !== '이용 가능';
  $('wrap').innerHTML = `
    <a class="back" href="members">${ICON.back}회원 관리</a>
    <div class="head">
      <div class="who"><div class="av">${esc(m.name[0])}</div><div>
        <h1>${esc(m.name)} ${stop ? BD(m.status, 'red', 'lg') : ''}</h1>
        <p>${m.join} 가입 · <span class="num">${m.joined.slice(0, 10).replace(/-/g, '.')}</span> · ${m.tier}</p></div></div>
      <div class="acts"><a class="btn primary" href="./#board&create=&m=${m.id}" ${stop ? 'aria-disabled="true" style="pointer-events:none;opacity:.35"' : ''}>이 회원으로 예약 등록</a></div>
    </div>
    ${stop ? `<div class="callout red"><div class="tx"><b>이용이 정지된 회원이에요</b><span>앱 로그인과 새 예약이 막혀 있어요. 이미 잡힌 예약은 그대로 유지돼요.</span></div></div>` : ''}
    <div class="facts">
      <div class="fact"><small>예약</small><b class="num">${act.length}회</b><span>취소 ${L.length - act.length}회</span></div>
      <div class="fact"><small>다가오는 예약</small><b>${up ? `${vById[up.villa].name}` : '없음'}</b><span class="num">${up ? `${mdw(up.in)} – ${mdw(up.out)}` : '–'}</span></div>
      <div class="fact"><small>누적 결제</small><b class="num">${won(paid)}</b><span>취소 제외</span></div>
      <div class="fact"><small>마케팅 수신</small><b>${m.push ? '받음' : '안 받음'}</b><span>${m.sub ? '구독 중' : '미구독'}</span></div>
    </div>
    <div class="grid">
      <div class="col">
        <section class="card"><h3>예약 내역 <span style="font-weight:500;color:var(--ink-3);font-size:14px">${L.length}건</span></h3>
          ${L.length ? `<table><thead><tr><th>숙소</th><th>체크인 → 체크아웃</th><th>인원</th><th>예약 경로</th><th>결제</th><th>예약 상태</th></tr></thead><tbody>
            ${L.map(r => `<tr data-r="${r.idx}"><td><b>${vById[r.villa].name}</b><span class="sub">${vById[r.villa].region}</span></td><td class="num">${mdw(r.in)} → ${mdw(r.out)}<span class="sub">${r.out - r.in}박</span></td><td>${r.adults + r.kids + r.infants}명</td><td>${chDot(r.ch)}</td><td>${PAY_LB[r.pay] || r.pay}</td><td>${stHTML(r)}</td></tr>`).join('')}</tbody></table>`
          : `<div class="empty">아직 예약이 없어요.<br><a class="tbtn" href="./#board&create=&m=${m.id}" style="margin-top:8px;color:var(--ink)">이 회원으로 예약 등록 ${ICON.chev}</a></div>`}
        </section>
        <section class="card"><h3>관리자 메모</h3>
          <div class="memo">${m.memos.map(x => `<div class="it">${esc(x.t)}<small>${x.m}</small></div>`).join('')}
            <div class="add"><input class="inp" id="memo" placeholder="회원 관리용 메모를 남겨요. 예약마다 보이지는 않아요."><button class="btn" id="addMemo">남기기</button></div></div>
        </section>
      </div>
      <div class="col">
        <section class="card"><h3>기본 정보 ${edit ? '' : '<button class="tbtn" data-edit>수정</button>'}</h3>
          ${edit ? `<div class="form"><label>전화번호</label><input class="inp num" id="fPhone" value="${fmtPhone(m.phone)}"><label>생일</label><input class="inp" type="date" id="fBirth" value="${m.birth}"></div>
            <span class="err" id="fErr" style="font-size:13px;color:var(--danger-ink)"></span>
            <div class="formfoot"><button class="btn sm" data-edit>취소</button><button class="btn sm primary" id="save">저장</button></div>`
          : `<dl class="kv"><dt>이름</dt><dd>${esc(m.name)}</dd><dt>이메일</dt><dd>${esc(m.email)}</dd><dt>전화번호</dt><dd class="num">${fmtPhone(m.phone)}</dd><dt>생일</dt><dd>${m.birth ? m.birth.replace(/-/g, '.') : '<span class="mut">입력 안 함</span>'}</dd></dl>`}
        </section>
        <section class="card"><h3>멤버십·상태</h3>
          <div class="row"><div>멤버십<small>등급별 혜택은 멤버십 관리에서 정해요</small></div><div class="segb">${['게스트','멤버'].map(x => `<button data-tier="${x}" class="${m.tier === x ? 'on' : ''}">${x}</button>`).join('')}</div></div>
          <div class="row"><div>운영 상태<small>${stop ? '앱 로그인과 새 예약이 막혀 있어요' : '앱을 정상적으로 쓸 수 있어요'}</small></div><button class="btn sm ${stop ? '' : ''}" data-status>${stop ? '이용 다시 허용' : '이용 정지'}</button></div>
        </section>
        <section class="card"><h3>계정·알림</h3>
          <div class="row"><div>가입 방식<small>${m.join === '카카오' ? '카카오로 로그인해요' : '이메일과 비밀번호로 로그인해요'}</small></div><span>${m.join}</span></div>
          <div class="row"><div>비밀번호<small>관리자가 직접 정하지 않고, 회원에게 재설정 링크를 보내요</small></div>${m.join === '카카오' ? '<span class="mut" style="font-size:13px">해당 없음</span>' : '<button class="btn sm" data-pw>재설정 링크 보내기</button>'}</div>
          <div class="row"><div>마케팅 푸시 수신<small>회원이 앱에서 바꿀 수 있어요</small></div><label class="tgl"><input type="checkbox" id="push" ${m.push ? 'checked' : ''}></label></div>
        </section>
      </div>
    </div>`;
}
function confirmStop(){
  const stop = m.status === '이용 가능';
  const box = document.createElement('div'); box.className = 'mscrim';
  box.innerHTML = `<div class="dlg"><h3>${stop ? `${esc(m.name)}님의 이용을 정지할까요?` : '이용을 다시 허용할까요?'}</h3><p>${stop ? '앱 로그인과 새 예약이 막혀요. 이미 잡힌 예약은 그대로 유지돼요.' : '앱 로그인과 예약을 다시 할 수 있어요.'}</p>
    <div class="f"><button class="btn xl" data-x>닫기</button><button class="btn xl ${stop ? 'danger' : 'primary'}" data-ok>${stop ? '이용 정지' : '다시 허용'}</button></div></div>`;
  document.body.appendChild(box);
  box.onclick = e => { if (e.target === box || e.target.closest('[data-x]')) return box.remove();
    if (e.target.closest('[data-ok]')){ m.status = stop ? '이용 정지' : '이용 가능'; m.memos.unshift({t:`운영 상태 변경 · ${m.status}`, m:`jelin · ${nowStamp()}`}); saveMember(m); box.remove(); render(); toast(stop ? '이용을 정지했어요' : '이용을 다시 허용했어요'); } };
}
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-edit]')){ edit = !edit; render(); return; }
  const tr = t.closest('tr[data-r]'); if (tr){ location.href = `reservation?id=${tr.dataset.r}`; return; }
  const tier = t.closest('[data-tier]'); if (tier && tier.dataset.tier !== m.tier){ m.tier = tier.dataset.tier; saveMember(m); render(); toast(`멤버십을 ${m.tier}(으)로 바꿨어요`.replace('(으)로', m.tier === '멤버' ? '로' : '로')); return; }
  if (t.closest('[data-status]')) return confirmStop();
  if (t.closest('[data-pw]')) return toast(`${m.email}로 비밀번호 재설정 링크를 보냈어요`);
  if (t.id === 'addMemo'){ const v = $('memo').value.trim(); if (!v) return; m.memos.unshift({t:v, m:`jelin · ${nowStamp()}`}); saveMember(m); render(); toast('메모를 남겼어요'); return; }
  if (t.id === 'save'){ const d = $('fPhone').value.replace(/\D/g, ''); if (d.length < 10){ $('fErr').textContent = '전화번호를 끝까지 입력해 주세요.'; return; } m.phone = d; m.birth = $('fBirth').value; saveMember(m); edit = false; render(); toast('기본 정보를 바꿨어요'); }
});
document.addEventListener('change', e => { if (e.target.id === 'push'){ m.push = e.target.checked; saveMember(m); render(); toast(m.push ? '마케팅 푸시를 받도록 바꿨어요' : '마케팅 푸시를 받지 않도록 바꿨어요'); } });
render();
</script>
</body>
</html>
