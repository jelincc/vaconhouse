<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/vacon-logo-stacked.svg" type="image/svg+xml">
<title>VACON house 예약 상세</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="admin.css?v=202610011200">
<style>
.wrap{max-width:1480px;width:100%;display:flex;flex-direction:column;gap:20px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--ink-3);font-weight:600;font-size:15px;text-decoration:none;align-self:flex-start;margin-left:-4px}
.back svg{width:18px;height:18px}
.back:hover{color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.head .lbls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.head h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.3}
.head p{margin:6px 0 0;font-size:16px;color:var(--ink-2)}
.head .acts{display:flex;gap:8px}
.head .acts .btn{height:48px;padding:0 22px;border-radius:12px;font-size:16px}
.calls{display:flex;flex-direction:column;gap:8px}
.callout .act{margin-left:auto;align-self:center}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.fact{padding:18px 22px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact small{display:block;font-size:15px;color:var(--ink-3);margin-bottom:2px}
.fact b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.fact span{display:block;font-size:15px;color:var(--ink-3);margin-top:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card > h3 .tbtn{margin-left:auto}
.money{display:grid;grid-template-columns:1fr auto;gap:10px 16px;font-size:15.5px}
.money .sum{font-weight:700;font-size:18px}
.money .m2{color:var(--ink-3);font-size:15px}
.opt{display:flex;justify-content:space-between;font-size:15.5px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.nt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;padding:10px 0;border-bottom:1px solid var(--line)}
.nt:last-child{border-bottom:0}
.nt small{display:block;font-size:14px;color:var(--ink-3)}
.form{display:grid;grid-template-columns:104px 1fr;gap:10px 12px;align-items:center;font-size:15px}
.form label{color:var(--ink-3)}
.stepper{display:inline-flex;align-items:center;gap:0;background:var(--surface-2);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:none;width:36px;height:36px;font-size:20px;color:var(--ink-2)}
.stepper span{min-width:28px;text-align:center;font-weight:600}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.frow small{color:var(--ink-3);margin-right:4px}
.formfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.raw{font-size:14px;color:var(--ink-3);background:var(--surface-2);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.meta{font-size:14px;color:var(--ink-3);display:grid;grid-template-columns:72px 1fr;gap:4px 8px;padding:0 4px}
.stnow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stnow .big{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.stnow .big i{width:10px;height:10px;border-radius:50%}
.hint{font-size:15px;color:var(--ink-3);margin:10px 0 0}
.life{list-style:none;margin:4px 0 14px;padding:0;display:flex}
.life li{flex:1;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--ink-4);position:relative}
.life li i{width:12px;height:12px;border-radius:50%;background:var(--surface-3);position:relative;z-index:1}
.life li:not(:last-child)::after{content:"";position:absolute;left:12px;right:0;top:5px;height:2px;background:var(--surface-3)}
.life li.done{color:var(--ink-2)}
.life li.done i,.life li.done::after{background:var(--ink-3)}
.life li.now{color:var(--ink);font-weight:700}
.life li.now i{background:var(--accent);box-shadow:0 0 0 4px var(--accent-2)}
.stacts{display:flex;flex-direction:column;gap:8px}
.stacts .btn{width:100%}
.dangertxt{color:var(--danger-ink);margin-top:14px}
.dangertxt:hover{color:var(--danger)}
.mscrim{position:fixed;inset:0;background:rgba(26,26,30,.36);z-index:45;display:grid;place-items:center;padding:16px}
.dlg{background:#fff;border-radius:24px;width:min(540px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dlg .h{padding:24px 24px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
.dlg .h p{margin:6px 0 0;font-size:15px;color:var(--ink-3)}
.dlg .b{padding:14px 24px 6px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg .f{padding:14px 20px 20px;display:flex;gap:8px}
.dlg .x{all:unset;cursor:pointer;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.dlg .x svg{width:24px;height:24px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl > label{font-size:15px;color:var(--ink-3);font-weight:500}
.fl .inp{height:44px}
.err{font-size:15px;color:var(--danger-ink)}
.segb{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px}
.segb button{flex:1;border:0;background:transparent;height:36px;border-radius:9px;font-weight:600;color:var(--ink-3);font-size:15px}
.segb button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugg button{border:0;background:#fff;border-radius:999px;height:30px;padding:0 12px;font-size:15px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line-2)}
@media (max-width:1180px){.grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.fact:nth-child(2){border-right:0}.fact:nth-child(-n+2){border-bottom:1px solid var(--line)}.pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side"></aside>
  <main class="main"><div class="wrap" id="wrap"></div></main>
</div>
<script src="data.js?v=202610011200"></script>
<script src="cases.js?v=202610011200" defer></script>
<script>
const id = +(new URLSearchParams(location.search).get('id') ?? 42);
const r = R[id] || R[42] || R.filter(Boolean)[0];
let edit = null;
const $ = x => document.getElementById(x);
const STATES = [['확정','예약 확정'],['이용완료','이용 완료'],['노쇼','노쇼']];

function render(){
  const v = vById[r.villa], p = price(r), is = issues(r);
  let [sec, pri] = nextStep(r);
  const cur = st(r);
  const closed = ['이용 완료','예약 취소','노쇼'].includes(cur);
  const moveFirst = is.includes('conflict');
  const inline = {notify:'resend', pay:'paid', clean:'clean', sync:'resync', dup:'dupOk', unseen:'seen'};
  $('wrap').innerHTML = `
    <a class="back" href="./#board">${ICON.back}예약 관리</a>
    <div class="head">
      <div>
        <div class="lbls">${stHTML(r)}${is.filter(k => k !== 'cancel' && k !== 'change').map(k => BD(ISSUE[k].lb, ISSUE[k].c, k === 'conflict' ? 'fill' : '')).join('')}</div>
        <h1>${esc(r.name)}님의 예약</h1>
        <p>${vFull(r.villa)} · <span class="num">${mdw(r.in)} – ${mdw(r.out)}</span> · ${r.out - r.in}박</p>
      </div>
      <div class="acts">
        ${moveFirst ? `<button class="btn" data-do="conflictOk">이미 해결했어요</button><button class="btn primary" data-move>다른 날짜·숙소로 옮기기</button>` : `${sec ? `<button class="btn" data-do="${sec}">${ACT[sec].lb}</button>` : ''}
        ${pri ? `<button class="btn ${ACT[pri].cls || 'primary'}" data-do="${pri}">${ACT[pri].lb}</button>` : ''}`}
      </div>
    </div>

    ${is.length ? `<div class="calls">${is.map(k => `<div class="callout ${ISSUE[k].c}"><span class="ico sm ${ISSUE[k].c}" style="background:#fff">${ICON[ISSUE[k].ic]}</span><div class="tx"><b>${ISSUE[k].lb}</b><span>${issueDesc(r, k)}</span></div>${inline[k] && inline[k] !== pri ? `<button class="btn sm line act" data-do="${inline[k]}">${ACT[inline[k]].lb}</button>` : ''}</div>`).join('')}</div>` : ''}

    <div class="grid">
      <div class="col">
        <section class="card"><h3>예약 정보</h3>
          <div class="spec">
            <div class="sg">숙소·일정 ${closed ? '' : '<button class="tbtn" data-move>변경</button>'}</div>
            <div class="k">숙소</div><div class="v">${vFull(r.villa)}<small>${v.type} · 최대 ${v.cap}인</small></div>
            <div class="k">객실 준비</div><div class="v">${r.flags.includes('clean') ? '<span class="bad">청소 완료 확인 전</span>' : cur === '이용 완료' ? '<span class="mut">퇴실 완료</span>' : '확인됨'}</div>
            <div class="k">체크인</div><div class="v num">${mdw(r.in)} 15:00</div>
            <div class="k">체크아웃</div><div class="v num">${mdw(r.out)} 11:00<small>${r.out - r.in}박</small></div>
            <div class="sg">예약자 ${edit === 'guest' || closed ? '' : '<button class="tbtn" data-edit="guest">수정</button>'}</div>
            ${edit === 'guest' ? `<div class="v w" style="grid-column:1/-1"><div class="form">
                <label for="fPhone">연락처</label><input class="inp num" id="fPhone" value="${esc(phoneOk(r) ? fmtPhone(r.phoneRaw) : r.phoneRaw)}">
                <label>인원</label><div class="frow">${[['adults','성인'],['kids','아동'],['infants','유아']].map(([k, lb]) => `<span><small>${lb}</small><span class="stepper"><button data-step="${k}:-1">−</button><span id="n_${k}">${r[k]}</span><button data-step="${k}:1">+</button></span></span>`).join('')}</div>
                <label>반려동물</label><label class="tgl" style="color:var(--ink)"><input type="checkbox" id="fPet" ${r.pet ? 'checked' : ''}>동반</label>
              </div>
              <div class="formfoot"><button class="btn sm" data-edit="">취소</button><button class="btn sm primary" id="saveGuest">저장</button></div></div>` : `
            <div class="k">예약자</div><div class="v">${esc(r.name)}${r.raw !== r.name ? `<span class="raw" title="현재 시스템에 저장된 값">원본 ${esc(r.raw)}</span>` : ''}</div>
            <div class="k">연락처</div><div class="v num">${phoneOk(r) ? fmtPhone(r.phoneRaw) : `<span class="bad">${esc(r.phoneRaw)} · 불완전</span>`}</div>
            <div class="k">인원</div><div class="v">${r.adults + r.kids + r.infants}명<small>성인 ${r.adults}${r.kids ? ` · 아동 ${r.kids}` : ''}${r.infants ? ` · 유아 ${r.infants}` : ''}</small></div>
            <div class="k">반려동물</div><div class="v">${r.pet ? '동반' : '<span class="mut">없음</span>'}</div>
            <div class="k">추가 옵션</div><div class="v">${p.opts.length ? p.opts.map(o => o[0]).join(', ') : '<span class="mut">없음</span>'}</div>
            <div class="k">계정</div><div class="v">${r.email ? esc(r.email) : '<span class="mut">비회원</span>'}</div>
            <div class="k">예약 경로</div><div class="v">${chDot(r.ch)}</div>`}
            <div class="sg">접수</div>
            <div class="k">예약번호</div><div class="v num">${r.id}</div>
            <div class="k">신청일</div><div class="v num">${r.created}</div>
            <div class="sg">운영 특이사항 ${edit === 'note' ? '' : '<button class="tbtn" data-edit="note">수정</button>'}</div>
            ${edit === 'note' ? `<div class="v" style="grid-column:1/-1"><textarea class="inp" id="fNote" placeholder="청소·입실 시 참고할 내용">${esc(r.note)}</textarea><div class="formfoot"><button class="btn sm" data-edit="">취소</button><button class="btn sm primary" id="saveNote">저장</button></div></div>`
              : `<div class="v" style="grid-column:1/-1">${esc(r.note) || '<span class="mut">없어요.</span>'}</div>`}
          </div>
        </section>
        <section class="card"><h3>결제</h3>
          <div class="spec">
            <div class="k">객실 요금</div><div class="v w r num">${won(p.room)}<small>${r.out - r.in}박</small></div>
            ${p.opts.map(o => `<div class="k">${o[0]}</div><div class="v w r num">${won(o[1])}<small>추가 옵션</small></div>`).join('')}
            <div class="k" style="color:var(--ink);font-weight:700">결제 금액</div><div class="v w r num sum">${won(p.sub)}</div>
            <div class="k">결제 수단</div><div class="v">${p.method}</div>
            <div class="k">결제 상태</div><div class="v">${payHTML(r)}</div>
            ${p.fee ? `<div class="k">채널 수수료</div><div class="v num">−${won(p.fee)}<small>${r.ch}</small></div><div class="k">정산 예정</div><div class="v num"><b>${won(p.net)}</b></div>` : ''}
          </div></section>
        <section class="card"><h3>고객 알림 발송 기록 <button class="tbtn" data-do="resend">입실 안내 다시 보내기</button></h3>
          <div class="spec" style="grid-template-columns:minmax(0,1fr) 160px 120px">
            <div class="k">알림</div><div class="k">발송 시각</div><div class="k">결과</div>
            ${r.notices.map(n => `<div class="v">${n.t}</div><div class="v num">${n.m}</div><div class="v">${n.ok ? '<span class="mut">발송 완료</span>' : BD('발송 실패','red')}</div>`).join('')}
          </div></section>
      </div>

      <div class="col">
        <section class="card hq-only"><h3>예약 상태</h3>
          ${(() => { const steps = ['예약 확정','이용 중','이용 완료']; const k = steps.indexOf(cur);
            return k >= 0 ? `<ol class="life">${steps.map((s, x) => `<li class="${x < k ? 'done' : x === k ? 'now' : ''}"><i></i><span>${s}</span></li>`).join('')}</ol>`
              : `<div class="stnow"><span class="big">${stHTML(r)}</span></div>`; })()}
          <div class="stacts">
            ${cur === '이용 중' || (cur === '이용 완료' && r.base === '이용완료') ? `<button class="btn" data-st="노쇼">노쇼로 바꾸기</button>` : ''}
            ${cur === '노쇼' ? `<button class="btn" data-st="확정">노쇼 취소하기</button>` : ''}
          </div>
          <p class="hint">${cur === '예약 취소' ? `취소된 예약이에요 · ${PAY_LB[r.pay] || ''}` : closed && r.base !== '이용완료' && r.base !== '노쇼' ? '이용이 끝난 예약은 바꿀 수 없어요. 메모는 남길 수 있어요.' : '상태를 바꾸면 변경 이력에 남아요.'}</p>
          ${closed ? '' : '<button class="tbtn dangertxt" data-cancel>예약 취소하기</button>'}
        </section>
        <section class="card hq-only"><h3>관리자 메모</h3>
          <div class="memos">${r.memos.map(m => `<div class="memo">${esc(m.t)}<small>${m.m}</small></div>`).join('')}</div>
          <div class="memo-in"><textarea class="inp" id="memoIn" maxlength="500" placeholder="운영팀에 남길 메모를 입력해 주세요"></textarea><span class="cnt" id="memoCnt">0/500</span></div>
          <div class="memo-foot"><button class="btn sm primary" id="memoAdd" disabled>메모 등록</button></div></section>
        <section class="card"><h3>취소·변경 이력 <span class="mut" style="font-weight:500;font-size:15px">${r.history.length}건</span></h3>
          <ul class="hist">${r.history.map(h => `<li class="${h.new ? 'new' : ''}"><span class="b"></span><div><div class="t">${esc(h.t)}</div><div class="m">${h.m}</div></div></li>`).join('')}</ul></section>
      </div>
    </div>`;
  document.title = `${r.name}님 예약 · VACON house`;
  mountSide();
}

$('wrap').addEventListener('click', e => {
  const t = e.target;
  const d = t.closest('[data-do]'); if (d){ const m = runAct(r, d.dataset.do); render(); toast(m); return; }
  const ed = t.closest('[data-edit]'); if (ed){ edit = ed.dataset.edit || null; render(); return; }
  if (t.closest('[data-move]')) return openMove();
  if (t.closest('[data-cancel]')) return openCancel();
  const stp = t.closest('[data-step]'); if (stp){ const [k, dv] = stp.dataset.step.split(':'); const el = $('n_' + k); el.textContent = Math.max(k === 'adults' ? 1 : 0, +el.textContent + +dv); return; }
  if (t.id === 'saveGuest'){
    const ph = $('fPhone').value.trim(), nA = +$('n_adults').textContent, nK = +$('n_kids').textContent, nI = +$('n_infants').textContent, pet = $('fPet').checked;
    const ch = [];
    if (ph.replace(/\D/g, '') !== r.phoneRaw.replace(/\D/g, '')){ ch.push(`연락처 ${r.phoneRaw} → ${ph}`); r.phoneRaw = ph; }
    if (nA !== r.adults || nK !== r.kids || nI !== r.infants){ ch.push(`인원 ${r.adults + r.kids + r.infants}명 → ${nA + nK + nI}명`); r.adults = nA; r.kids = nK; r.infants = nI; }
    if (pet !== r.pet){ ch.push(`반려동물 ${pet ? '동반' : '없음'}`); r.pet = pet; }
    edit = null;
    if (ch.length){ log(r, '예약자 정보 수정 · ' + ch.join(', ')); save(r); toast('예약자 정보를 바꿨어요'); }
    render(); return;
  }
  if (t.id === 'saveNote'){ const v = $('fNote').value.trim(); if (v !== r.note){ log(r, `특이사항 수정 · ${v || '삭제'}`); r.note = v; save(r); toast('특이사항을 저장했어요'); } edit = null; render(); return; }
  const stb = t.closest('[data-st]'); if (stb){ const v = stb.dataset.st, before = st(r); r.base = v; log(r, `상태 변경 · ${before} → ${st(r)}`); save(r); render(); return toast(`예약 상태를 ${josa(st(r), '으로', '로')} 바꿨어요`); }
  if (t.id === 'stSave'){ const v = $('stSel').value; if (v !== r.base && !(v === '확정' && st(r) === '예약 확정')){ const before = st(r); r.base = v; log(r, `상태 변경 · ${before} → ${st(r)}`); save(r); toast(`예약 상태를 ${josa(st(r), '으로', '로')} 바꿨어요`); } render(); return; }
  if (t.id === 'memoAdd'){ const v = $('memoIn').value.trim().slice(0, 500); if (!v) return; r.memos.unshift({t:v, m:`jelin · ${nowStamp()}`}); log(r, '관리자 메모 추가'); save(r); render(); toast('메모를 남겼어요'); }
});

/* ---------- 일정·숙소 변경 ---------- */
const XI = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><path d="M5 5l10 10M15 5L5 15"/></svg>';
function dlg(html){ const b = document.createElement('div'); b.className = 'mscrim'; b.innerHTML = `<div class="dlg" role="dialog">${html}</div>`; document.body.appendChild(b); b.addEventListener('click', e => { if (e.target === b || e.target.closest('[data-x]')) b.remove(); }); return b; }
function openMove(){
  const chan = r.ch === '에어비앤비' || r.ch === '네이버';
  const F = {villa:r.villa, a:r.in, b:r.out};
  const box = dlg(`<div class="h"><div><h3>일정·숙소 변경</h3><p>${esc(r.name)}님 · 지금 ${vFull(r.villa)} ${md(r.in)} – ${md(r.out)}</p></div><button class="x" data-x aria-label="닫기">${XI}</button></div>
    <div class="b">
      ${chan ? `<div class="callout orange"><div class="tx"><b>${r.ch} 예약은 날짜를 ${r.ch}에서 바꿔야 해요</b><span>여기서 날짜를 바꾸면 채널과 어긋나요. 같은 날짜 안에서 숙소만 옮길 수 있어요.</span></div></div>` : ''}
      <div class="fl"><label>숙소</label><select class="inp" id="mV">${VILLAS.map(v => `<option value="${v.id}" ${v.id === r.villa ? 'selected' : ''}>${v.region} ${v.name} · 최대 ${v.cap}인</option>`).join('')}</select></div>
      <div class="fg"><div class="fl"><label>체크인</label><input class="inp" type="date" id="mA" value="${isoOf(r.in)}" ${chan ? 'disabled' : ''}></div><div class="fl"><label>체크아웃</label><input class="inp" type="date" id="mB" value="${isoOf(r.out)}" ${chan ? 'disabled' : ''}></div></div>
      <div id="mCheck"></div>
      <label class="tgl" style="color:var(--ink)"><input type="checkbox" id="mNotify" ${phoneOk(r) ? 'checked' : 'disabled'}>고객에게 변경 알림톡 보내기${phoneOk(r) ? '' : ' (연락처 불완전)'}</label>
    </div>
    <div class="f"><button class="btn xl" data-x>닫기</button><button class="btn xl primary" id="mGo">바꾸기</button></div>`);
  const q = s => box.querySelector(s);
  function check(){
    F.villa = q('#mV').value; F.a = chan ? r.in : offOf(q('#mA').value); F.b = chan ? r.out : offOf(q('#mB').value);
    const same = F.villa === r.villa && F.a === r.in && F.b === r.out;
    const n = F.b - F.a, v = vById[F.villa];
    const c = clashes(F.villa, F.a, F.b, r);
    const over = r.adults + r.kids + r.infants > v.cap;
    const oldP = price(r).sub, newP = price({...r, villa:F.villa, in:F.a, out:F.b}).sub;
    let h = '';
    if (n <= 0) h = '<div class="err">체크아웃은 체크인 다음 날 이후여야 해요</div>';
    else if (F.a < 0) h = '<div class="err">지난 날짜로는 옮길 수 없어요</div>';
    else if (c.res.length || c.blk.length){
      const alt = VILLAS.filter(x => x.id !== F.villa && freeFor(x.id, F.a, F.b, r) && x.cap >= r.adults + r.kids);
      h = `<div class="callout red"><div class="tx"><b>이 날짜엔 옮길 수 없어요</b><span>겹치는 일정: ${c.res.map(x => `${esc(x.name)}님 ${md(x.in)} – ${md(x.out)} (${CH[x.ch].lb})`).concat(c.blk.map(x => `판매 막기 ${md(x.in)} – ${md(x.out)}`)).join(', ')}</span>${alt.length ? `<div class="sugg">${alt.map(x => `<button data-alt="${x.id}">${x.region} ${x.name}</button>`).join('')}</div>` : ''}</div></div>`;
    } else if (over) h = `<div class="err">${josa(v.name, '은', '는')} 최대 ${v.cap}인이라 ${r.adults + r.kids + r.infants}명이 묵을 수 없어요</div>`;
    else if (!same) h = `<div class="callout" style="background:var(--ok-soft)"><div class="tx"><b>옮길 수 있어요</b><span>${vFull(F.villa)} ${mdw(F.a)} – ${mdw(F.b)} · ${n}박${r.pay === '기업숙박권' ? '' : newP !== oldP ? ` · 금액 ${won(oldP)} → ${won(newP)} (새 금액 ${won(newP)} 결제 후 기존 결제 ${won(oldP)} 전액 환불)` : ' · 금액 변동 없음'}</span></div></div>`;
    const ok = !same && n > 0 && F.a >= 0 && !c.res.length && !c.blk.length && !over;
    q('#mCheck').innerHTML = h; q('#mGo').disabled = !ok; q('#mGo').style.opacity = ok ? 1 : .35;
  }
  box.addEventListener('change', check); box.addEventListener('input', check);
  box.addEventListener('click', e => {
    const a = e.target.closest('[data-alt]'); if (a){ q('#mV').value = a.dataset.alt; return check(); }
    if (e.target.id === 'mGo' && !e.target.disabled){
      const before = `${vFull(r.villa)} ${md(r.in)} – ${md(r.out)}`;
      r.villa = F.villa; r.in = F.a; r.out = F.b;
      log(r, `일정·숙소 변경 · ${before} → ${vFull(r.villa)} ${md(r.in)} – ${md(r.out)}`);
      if (q('#mNotify').checked) r.notices.push({t:'예약 변경 알림톡', m:nowStamp(), ok:true});
      save(r); refreshConflicts(); box.remove(); render(); toast('예약을 옮겼어요' + (issues(r).includes('conflict') ? '' : '. 충돌도 풀렸어요'));
    }
  });
  check();
}

/* ---------- 예약 취소 · 환불 ---------- */
function openCancel(){
  const chan = r.ch === '에어비앤비' || r.ch === '네이버', corp = r.pay === '기업숙박권';
  let reason = '고객 요청';
  const box = dlg(`<div class="h"><div><h3>예약을 취소할까요?</h3><p>${esc(r.name)}님 · ${vFull(r.villa)} ${mdw(r.in)} – ${mdw(r.out)}</p></div><button class="x" data-x aria-label="닫기">${XI}</button></div>
    <div class="b">
      <div class="fl"><label>취소 사유</label><div class="segb">${['고객 요청','숙소 사정','중복 예약','기타'].map(x => `<button data-rs="${x}" class="${x === reason ? 'on' : ''}">${x}</button>`).join('')}</div></div>
      <div id="xRefund"></div>
      <label class="tgl" style="color:var(--ink)"><input type="checkbox" id="xNotify" ${phoneOk(r) ? 'checked' : 'disabled'}>고객에게 취소 알림톡 보내기${phoneOk(r) ? '' : ' (연락처 불완전)'}</label>
    </div>
    <div class="f"><button class="btn xl" data-x>닫기</button><button class="btn xl danger" id="xGo">예약 취소</button></div>`);
  const q = s => box.querySelector(s);
  function draw(){
    /* 숙소 사정·중복 예약만 기한과 관계없이 전액 · 숙박권 전부 반환. 고객 요청·기타는 규정대로 */
    const f = refundOf(r), full = reason === '숙소 사정' || reason === '중복 예약';
    const back = full || r.in >= 3;
    const amt = full ? f.paid : f.amount;
    q('#xRefund').innerHTML = corp ? (back ? `<div class="callout"><div class="tx"><b>숙박권 ${r.out - r.in}박이 회사 잔여로 돌아가요</b><span>${full ? `${josa(reason, '으로', '로')} 취소하면 기한과 관계없이 숙박권을 전부 돌려드려요` : `체크인 3일 전(${md(r.in - 3)})까지 취소해 숙박권이 돌아가요`}</span></div></div>` : `<div class="callout orange"><div class="tx"><b>숙박권이 돌아가지 않아요</b><span>체크인 3일 전(${md(r.in - 3)})이 지나 숙박권 ${r.out - r.in}박은 사용한 것으로 계산돼요.</span></div></div>`)
      : chan ? `<div class="callout orange"><div class="tx"><b>환불은 ${r.ch}에서 처리돼요</b><span>${r.ch}에서 먼저 취소해 주세요. 여기서는 취소 기록만 남기고 달력을 열어요.</span></div></div>`
      : `<div class="callout ${amt ? '' : 'orange'}"><div class="tx"><b>환불 금액 ${won(amt)}${full ? ' · 전액' : f.rate < 1 && f.rate > 0 ? ' · 50%' : f.rate === 0 ? ' · 환불 없음' : ' · 전액'}</b><span>결제 ${won(f.paid)} · ${full ? `${josa(reason, '으로', '로')} 취소하면 규정과 관계없이 전액 환불해요` : `${md(r.in - 7)}까지 전액, ${md(r.in - 3)}까지 50%, 이후 환불 없음`}</span></div></div>`;
    box._amt = amt; box._back = back;
  }
  box.addEventListener('click', e => {
    const rs = e.target.closest('[data-rs]'); if (rs){ reason = rs.dataset.rs; box.querySelectorAll('[data-rs]').forEach(b => b.classList.toggle('on', b === rs)); return draw(); }
    if (e.target.id === 'xGo'){
      r.base = '취소'; r.pay = corp || chan ? r.pay : box._amt ? '환불완료' : r.pay; /* 결제사 자동 환불 */
      if (corp && !box._back) r.noReturn = true;
      r.flags = r.flags.filter(x => x !== 'conflict');
      log(r, `관리자 취소 · ${reason}${corp ? (box._back ? ` · 숙박권 ${r.out - r.in}박 반환` : ' · 숙박권 반환 없음') : chan ? ` · ${r.ch}에서 환불` : ` · 환불 ${won(box._amt)} · 결제사 자동 환불`}`);
      if (q('#xNotify').checked) r.notices.push({t:'예약 취소 알림톡', m:nowStamp(), ok:true});
      save(r); refreshConflicts(); box.remove(); render(); toast('예약을 취소했어요');
    }
  });
  draw();
}

const HP = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(x => x.split('=').map(decodeURIComponent)));
if (HP.act === 'edit') edit = 'guest';
render();
if (HP.act === 'move') openMove();
if (HP.act === 'cancel') openCancel();
if (HP.act === 'status'){ const s = document.querySelector('[data-st]'); if (s){ s.focus(); s.closest('.card').classList.add('flash'); } }
document.addEventListener('input', e => {
  if (e.target.id !== 'memoIn') return;
  const n = e.target.value.length, c = document.getElementById('memoCnt');
  c.textContent = `${n}/500`; c.classList.toggle('full', n >= 500);
  document.getElementById('memoAdd').disabled = !e.target.value.trim();
});
</script>
</body>
</html>
