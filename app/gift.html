<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/vacon-logo-stacked.svg" type="image/svg+xml">
<title>베이컨하우스 숙박권 선물하기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../admin/admin.css">
<style>
body{background:#fff}
.stage{min-height:100vh;display:flex;justify-content:center;align-items:center;gap:64px;padding:40px 24px;flex-wrap:wrap}
/* side panel */
.side2{width:360px;display:flex;flex-direction:column;gap:20px}
.side2 .logo-svg{width:120px}
.side2 h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.side2 p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.6}
.grp{display:flex;flex-direction:column;gap:8px}
.grp > b{font-size:13px;color:var(--ink-3);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:0;border-radius:999px;height:34px;padding:0 14px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:#3E434B;color:#fff}
.sim{background:var(--surface-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sim .tg{font-size:14px;font-weight:600}
.sim .tg small{display:block;font-size:13px;font-weight:500;color:var(--ink-3)}
.sim .acts{display:flex;flex-direction:column;gap:6px}
.sim .acts .btn{justify-content:flex-start;background:#fff;height:42px;border-radius:12px}
.sim .acts .btn:hover{background:var(--surface-3)}
.sim .acts .btn svg{width:16px;height:16px;color:var(--ink-3)}
.links{display:flex;gap:14px;font-size:13px}
.links a,.links button{color:var(--ink-3);font-weight:600;text-decoration:none;background:none;border:0;padding:0;font-size:13px}

/* phone */
.phone{width:390px;height:820px;border-radius:52px;background:#1A1A1E;padding:12px;box-shadow:0 30px 80px rgba(26,26,30,.22);flex:none}
.scr{width:100%;height:100%;border-radius:42px;background:#fff;overflow:hidden;position:relative;display:flex;flex-direction:column}
.sbar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-size:15px;font-weight:600;flex:none}
.sbi{display:flex;gap:6px;align-items:center}
.nav2{height:52px;display:flex;align-items:center;gap:6px;padding:0 12px;flex:none}
.nav2 .bk{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.nav2 .bk svg{width:24px;height:24px}
.nav2 b{font-size:17px;font-weight:700}
.body{flex:1;overflow:auto;padding:4px 20px 24px}
.body::-webkit-scrollbar{display:none}
.h2{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.4;margin:6px 0 20px}
.h2 small{display:block;font-size:15px;font-weight:500;color:var(--ink-3);margin-top:6px;letter-spacing:-.01em;line-height:1.5}
.h2 em{font-style:normal;color:var(--accent)}
.sec{font-size:17px;font-weight:700;margin:28px 0 6px;display:flex;justify-content:space-between;align-items:center}
.sec small{font-size:14px;font-weight:600;color:var(--ink-3)}
.tabbar{height:78px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:18px;flex:none}
.tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-4)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--ink)}
.cta{flex:none;padding:10px 20px 30px;background:#fff}
.cta .btn{width:100%;height:56px;border-radius:16px;font-size:17px}
.cta .btn + .btn{margin-top:8px}
.cta .note{font-size:13px;color:var(--ink-3);text-align:center;margin-bottom:10px}

/* MY */
.prof{display:flex;align-items:center;gap:14px;margin:6px 0 20px}
.prof .av{width:56px;height:56px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--ink-2)}
.prof b{font-size:20px;letter-spacing:-.02em;display:block}
.prof small{font-size:14px;color:var(--ink-3)}
.nights{background:var(--surface-2);border-radius:22px;padding:20px;display:grid;grid-template-columns:1fr 1fr}
.nights div{display:flex;flex-direction:column;gap:2px}
.nights div + div{border-left:1px solid var(--line-2);padding-left:20px}
.nights small{font-size:13.5px;color:var(--ink-3)}
.nights b{font-size:24px;letter-spacing:-.03em}
.nights b span{font-size:14px;color:var(--ink-3);font-weight:500;margin-left:2px}
.menu{display:flex;flex-direction:column;margin-top:14px}
.menu button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;height:58px;font-size:16px;font-weight:500}
.menu button .l{flex:1}
.menu button .r{font-size:14px;color:var(--ink-3);font-weight:500}
.menu button .r.hot{color:var(--accent-ink);font-weight:600}
.menu button svg{width:18px;height:18px;color:var(--ink-4)}
.menu hr{border:0;height:8px;background:var(--surface-2);margin:8px -20px}

/* gift list */
.gift{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;padding:12px 0;width:100%}
.gift .ic{width:48px;height:48px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.gift .ic svg{width:24px;height:24px}
.gift .ic.on{background:var(--accent-soft);color:var(--accent)}
.gift .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gift .tx b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gift .tx small{font-size:13.5px;color:var(--ink-3)}
.gift .rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;flex:none}
.gift .rt span{font-size:14px;font-weight:600;color:var(--ink-2)}
.gift .rt small{font-size:12.5px;color:var(--ink-3)}
.gift .rt small.hot{color:var(--accent-ink);font-weight:600}
.empty{padding:36px 0;text-align:center;color:var(--ink-3);font-size:14.5px}
.soft{background:var(--surface-2);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:6px}
.soft b{font-size:17px;letter-spacing:-.02em}
.soft span{font-size:14px;color:var(--ink-2);line-height:1.55}
.soft .btn{margin-top:10px;height:48px;border-radius:14px}
.soft.red{background:var(--danger-soft)}

/* create */
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:18px;background:var(--surface-2);margin-bottom:8px}
.opt .rd{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--line-2);flex:none;display:grid;place-items:center}
.opt.on{background:var(--accent-soft)}
.opt.on .rd{box-shadow:inset 0 0 0 7px var(--accent)}
.opt .tx{flex:1;display:flex;flex-direction:column}
.opt .tx b{font-size:17px}
.opt .tx small{font-size:13.5px;color:var(--ink-3)}
.opt .n{font-size:15px;font-weight:600;color:var(--ink-2)}
.opt:disabled,.opt.off{cursor:default;opacity:.45}
.field{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.field label{font-size:13.5px;color:var(--ink-3);font-weight:500}
.field .inp{height:54px;border-radius:14px;font-size:16px;border:0;background:var(--surface-2);padding:0 16px;outline:none}
.field .inp:focus{box-shadow:inset 0 0 0 2px #3E434B}
.rules{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:10px;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.rules li svg{width:18px;height:18px;color:var(--ink-4);flex:none;margin-top:2px}

/* detail */
.clock{background:var(--surface-2);border-radius:20px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.clock.hot{background:var(--accent-soft)}
.clock small{display:block;font-size:13.5px;color:var(--ink-3)}
.clock b{font-size:17px}
.clock .left{font-size:22px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.clock.hot .left{color:var(--accent-ink)}
.track{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column}
.track li{display:grid;grid-template-columns:26px 1fr auto;gap:12px;padding-bottom:18px;position:relative}
.track li::before{content:"";position:absolute;left:12px;top:28px;bottom:2px;width:2px;background:var(--line)}
.track li.done::before{background:var(--ink)}
.track li:last-child::before{display:none}
.track .n{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--ink-4);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.track .n svg{width:14px;height:14px}
.track li.done .n{background:var(--ink);color:#fff}
.track li.now .n{background:var(--accent);color:#fff}
.track li.back .n{background:var(--surface-3);color:var(--ink-2)}
.track b{font-size:15.5px;display:block;margin-top:2px}
.track small{font-size:13.5px;color:var(--ink-3)}
.track li:not(.done):not(.now):not(.back) b{color:var(--ink-4);font-weight:600}
.track .d{font-size:13px;color:var(--ink-3);margin-top:3px;white-space:nowrap}
.kv2{display:flex;flex-direction:column;margin-top:4px}
.kv2 div{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv2 div:last-child{border-bottom:0}
.kv2 span{color:var(--ink-3);flex:none}
.kv2 b{font-weight:600;text-align:right}
.hr8{height:8px;background:var(--surface-2);margin:22px -20px 8px}

/* share sheet, push, toast */
.shscrim{position:absolute;inset:0;background:rgba(26,26,30,.4);z-index:10;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:28px 22px 34px}
.sheet h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.4}
.sheet p{margin:8px 0 22px;font-size:15px;color:var(--ink-2);line-height:1.55}
.sheet .card{background:var(--surface-2);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center;margin-bottom:22px}
.sheet .card .ic{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sheet .card .ic svg{width:22px;height:22px}
.sheet .card b{display:block;font-size:15.5px}
.sheet .card small{font-size:13px;color:var(--ink-3)}
.sheet .btn{width:100%;height:56px;border-radius:16px;font-size:17px}
.sheet .btn + .btn{margin-top:8px}
.btn.kakao{background:#FEE500;color:#191919}
.btn.kakao:hover{background:#F4DC00}
.btn.kakao svg{width:20px;height:20px}
.btn.ghost{background:none;color:var(--ink-3)}
.push{position:absolute;left:10px;right:10px;top:8px;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-radius:22px;padding:12px 14px;display:flex;gap:12px;box-shadow:0 12px 32px rgba(26,26,30,.18);cursor:pointer;animation:drop .35s ease-out}
.push img{width:38px;height:38px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);padding:5px;flex:none}
.push .tx{flex:1;min-width:0}
.push .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3)}
.push b{display:block;font-size:14.5px;margin-top:1px}
.push p{margin:1px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.4}
@keyframes drop{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
.ptoast{position:absolute;left:20px;right:20px;bottom:110px;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 28px rgba(26,26,30,.14);border-radius:16px;padding:14px 16px;font-size:14.5px;display:flex;gap:8px;align-items:center;z-index:12}
.ptoast svg{width:20px;height:20px;color:var(--ok);flex:none}
@media (max-width:900px){.stage{gap:28px}.side2{width:100%;max-width:390px}}
@media (max-width:430px){.stage{padding:24px 16px}.phone{width:100%;height:760px;border-radius:44px;padding:8px}.scr{border-radius:36px}}
</style>
</head>
<body>
<div class="stage">
  <aside class="side2" id="side"></aside>
  <div class="phone"><div class="scr" id="scr"></div></div>
</div>
<script src="../admin/data.js"></script>
<script>
const $ = id => document.getElementById(id);
/* 시간: 9.28 00:00 기준 시각(h). 지금은 9.28 14:00 */
const NOW = 14, LIMIT = 48;
const hm = h => { const d = dOf(Math.floor(h / 24)), m = ((h % 24) + 24) % 24; return `${d.getMonth()+1}.${d.getDate()} (${WD[d.getDay()]}) ${String(Math.floor(m)).padStart(2,'0')}:${m % 1 ? '30' : '00'}`; };
const dayOf = h => md(Math.floor(h / 24));
const GI = {
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11.5" rx="2"/><path d="M2.5 9h19v-3h-19zM12 6v14.5"/><path d="M12 6c-1.5-3.2-5.5-3.2-5.5-.8C6.5 6 8 6 12 6zM12 6c1.5-3.2 5.5-3.2 5.5-.8 0 .8-1.5.8-5.5.8z"/></svg>',
  kakao: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5c-5 0-9 3.2-9 7.1 0 2.5 1.6 4.7 4.1 5.9l-.9 3.4c-.1.3.3.6.6.4l4-2.6c.4 0 .8.1 1.2.1 5 0 9-3.2 9-7.2S17 3.5 12 3.5z"/></svg>',
  clock: I('<circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.6 1.6"/>'),
  back: I('<path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 3.5v3.3h-3.3"/>'),
  user: I('<circle cx="10" cy="7" r="3.2"/><path d="M3.8 17c.5-3.2 3-5 6.2-5s5.7 1.8 6.2 5"/>'),
};

/* ---------- 데이터 ---------- */
const KEY = 'vh-gift-v1';
const SEED = () => ({
  member: '이용 가능',
  left: {평일: 9, 주말: 1},
  gifts: [
    {id:'G-2609-4471', type:'평일', memo:'수아님', made:NOW - 43.5, sent:NOW - 43.5, st:'발송됨'},
    {id:'G-2609-4402', type:'주말', memo:'현우님', made:NOW - 18, sent:NOW - 18, reg:'이현우', regAt:NOW - 15.5, st:'사용 가능'},
    {id:'G-2609-3318', type:'주말', memo:'지민님', made:-196, sent:-196, reg:'김지민', regAt:-193, st:'예약 완료', res:{v:'v1', in:5, at:-180}},
    {id:'G-2609-2210', type:'평일', memo:'엄마', made:-652, sent:-651, reg:'박미정', regAt:-640, st:'이용 완료', res:{v:'v2', in:-13, at:-620}},
    {id:'G-2609-1187', type:'주말', memo:'', made:-436, sent:-435, st:'회수 완료', backAt:-436 + LIMIT},
  ],
});
let D; try { D = JSON.parse(localStorage.getItem(KEY)) || SEED(); } catch(e){ D = SEED(); }
const saveD = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(e){} };
const gById = id => D.gifts.find(g => g.id === id);
const OPEN = ['발송 전','발송됨','사용 가능'];
const isOpen = g => OPEN.includes(g.st);
const hoursLeft = g => Math.max(0, g.made + LIMIT - NOW);
const leftTxt = g => { const h = hoursLeft(g); return h < 1 ? '1시간 안에 끝나요' : `${Math.floor(h)}시간 남음`; };
const who = g => g.memo || (g.reg ? first(g.reg) + '님' : '받는 분');
const first = n => n.slice(1);
const isWeekend = o => [5, 6].includes(dOf(o).getDay());
const OWNER = {name:'최하은', plan:'Dual Life Plan', start:'2026.03.01'};

/* ---------- 화면 스택 ---------- */
let stack = [{s:'my'}];
const cur = () => stack[stack.length - 1];
const push = o => { stack.push(o); draw(); $('scr').querySelector('.body')?.scrollTo(0, 0); };
const pop = () => { if (stack.length > 1) stack.pop(); draw(); };

function frame(title, body, cta = '', tab = false){
  return `<div class="sbar"><span>9:41</span><span class="sbi"><svg viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12" width="26" height="12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.6" fill="currentColor"/><path d="M24 4v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".4"/></svg></span></div>
    ${title !== null ? `<div class="nav2">${stack.length > 1 ? `<button class="bk" data-back aria-label="뒤로">${ICON.back}</button>` : ''}<b>${title}</b></div>` : ''}
    <div class="body">${body}</div>${cta}
    ${tab ? `<nav class="tabbar">
      <button data-soon="홈"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>홈</button>
      <button data-soon="탐색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4" stroke-linecap="round"/></svg>탐색</button>
      <button data-soon="예약 내역"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="16" height="15" rx="3"/><rect x="7" y="3" width="2" height="4" rx="1"/><rect x="15" y="3" width="2" height="4" rx="1"/></svg>예약 내역</button>
      <button class="on"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6z"/></svg>MY</button></nav>` : ''}`;
}

/* 목록 한 줄: 오른쪽은 지금 상태 한 마디, 확인이 필요할 때만 주황 */
function giftRow(g){
  let st, sub = '', hot = false;
  if (g.st === '발송 전'){ st = '보내기 전'; sub = leftTxt(g); hot = true; }
  else if (g.st === '발송됨'){ st = '받기 전'; sub = leftTxt(g); hot = hoursLeft(g) < 12; }
  else if (g.st === '사용 가능'){ st = '예약 전'; sub = leftTxt(g); hot = hoursLeft(g) < 12; }
  else if (g.st === '예약 완료'){ st = '예약 완료'; sub = `${md(g.res.in)} 체크인`; }
  else if (g.st === '이용 완료'){ st = '다녀왔어요'; sub = `${md(g.res.in + 1)} 체크아웃`; }
  else if (g.st === '노쇼'){ st = '이용 안 함'; sub = `${md(g.res.in)} 미입실`; }
  else { st = '1박 돌아옴'; sub = `${dayOf(g.backAt)} 반환`; }
  return `<button class="gift" data-g="${g.id}"><span class="ic ${isOpen(g) ? 'on' : ''}">${GI.gift}</span>
    <span class="tx"><b>${esc(who(g))}</b><small>${g.type} 1박 · ${dayOf(g.made)} 선물</small></span>
    <span class="rt"><span>${st}</span><small class="${hot ? 'hot' : ''}">${sub}</small></span></button>`;
}

/* ---------- 화면 ---------- */
function sMy(){
  const open = D.gifts.filter(isOpen).length;
  return frame(null, `
    <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px"><b style="font-size:22px;letter-spacing:-.02em">MY</b></div>
    <div class="prof"><span class="av">${OWNER.name[1]}</span><div><b>${OWNER.name}</b><small>${OWNER.plan} · 사용개시일 ${OWNER.start}</small></div></div>
    <div class="nights"><div><small>평일 잔여</small><b class="num">${D.left.평일}<span>/ 16박</span></b></div><div><small>주말 잔여</small><b class="num">${D.left.주말}<span>/ 14박</span></b></div></div>
    <div class="menu">
      <button data-go="gifts"><span class="l">숙박권 선물하기</span>${open ? `<span class="r hot">진행 중 ${open}건</span>` : ''}${ICON.chev}</button>
      <button data-soon="예약 내역"><span class="l">예약 내역</span>${ICON.chev}</button>
      <button data-soon="관리비 결제"><span class="l">관리비 결제</span><span class="r">${D.member === '관리비 미납' ? '<span style="color:var(--danger-ink);font-weight:600">결제 필요</span>' : '10.1 결제 예정'}</span>${ICON.chev}</button>
      <hr>
      <button data-soon="공지사항"><span class="l">공지사항</span>${ICON.chev}</button>
      <button data-soon="설정"><span class="l">설정</span>${ICON.chev}</button>
    </div>`, '', true);
}

function sGifts(){
  const open = D.gifts.filter(isOpen).sort((a, b) => (b.st === '발송 전') - (a.st === '발송 전') || hoursLeft(a) - hoursLeft(b));
  const past = D.gifts.filter(g => !isOpen(g)).sort((a, b) => b.made - a.made);
  const can = D.member === '이용 가능', total = D.left.평일 + D.left.주말;
  let head;
  if (D.member === '사용 시작 전') head = `<div class="h2">사용개시일부터<br>선물할 수 있어요<small>사용개시일 10.1 이후에 최초 결제를 마치면 숙박권을 선물할 수 있어요.</small></div>`;
  else if (D.member === '관리비 미납') head = `<div class="h2">관리비를 결제하면<br>다시 선물할 수 있어요<small>이미 보낸 선물은 그대로 쓸 수 있고, 진행 상황도 계속 볼 수 있어요.</small></div>`;
  else if (!total) head = `<div class="h2">선물할 수 있는<br>숙박일이 없어요<small>보낸 선물이 48시간 안에 예약되지 않으면 1박이 돌아와요.</small></div>`;
  else head = `<div class="h2">숙박권 1박을<br>선물할 수 있어요<small>평일 ${D.left.평일}박 · 주말 ${D.left.주말}박 남았어요</small></div>`;
  return frame('숙박권 선물하기', `
    ${head}
    ${open.length ? `<div class="sec">예약 전 <small>48시간 안에 예약해야 해요</small></div>${open.map(giftRow).join('')}` : ''}
    <div class="sec">보낸 선물</div>
    ${past.length ? past.map(giftRow).join('') : '<div class="empty">아직 보낸 선물이 없어요</div>'}`,
    can && total ? `<div class="cta"><button class="btn primary" data-go="new">선물하기</button></div>`
      : D.member === '관리비 미납' ? `<div class="cta"><button class="btn primary" data-soon="관리비 결제">관리비 결제하기</button></div>` : '');
}

function sNew(){
  const c = cur();
  if (!c.type) c.type = D.left.주말 ? '주말' : '평일';
  const opt = (t, sub) => { const n = D.left[t], off = !n; return `<button class="opt ${c.type === t && !off ? 'on' : ''} ${off ? 'off' : ''}" data-type="${t}" ${off ? 'disabled' : ''}><span class="rd"></span><span class="tx"><b>${t} 1박</b><small>${off ? `남은 ${t} 숙박일이 없어요` : sub}</small></span><span class="n num">${n}박 남음</span></button>`; };
  return frame('', `
    <div class="h2">어떤 숙박권을<br>선물할까요?<small>받는 분은 고른 요일에만 예약할 수 있어요.</small></div>
    ${opt('평일', '일요일 ~ 목요일 밤')}
    ${opt('주말', '금요일 · 토요일 · 공휴일 전날 밤')}
    <div class="field"><label for="memo">받는 분 (나만 보는 이름)</label><input class="inp" id="memo" placeholder="예: 지민님, 엄마" maxlength="12" value="${esc(c.memo || '')}" autocomplete="off"></div>
    <ul class="rules">
      <li>${ICON.info}<span>선물하면 ${c.type} 잔여 숙박일에서 1박이 바로 빠져요.</span></li>
      <li>${GI.clock}<span>받는 분이 <b>48시간 안에</b> 예약하지 않으면 1박이 다시 돌아와요.</span></li>
      <li>${GI.user}<span>받는 분이 등록, 예약, 이용을 마칠 때마다 알려드려요.</span></li>
    </ul>`,
    `<div class="cta"><button class="btn primary" data-make>${c.type} 1박 선물하기</button></div>`);
}

function sDetail(){
  const g = gById(cur().g), w = who(g), r = g.res, v = r && vById[r.v];
  let h, sub;
  if (g.st === '발송 전'){ h = '아직 선물을<br>보내지 않았어요'; sub = '카카오톡으로 보내야 받는 분이 쓸 수 있어요.'; }
  else if (g.st === '발송됨'){ h = `${esc(josa(w, '이', '가'))} 아직<br>선물을 받지 않았어요`; sub = '받는 분이 링크를 열고 등록하면 알려드릴게요.'; }
  else if (g.st === '사용 가능'){ h = `${esc(josa(w, '이', '가'))} 선물을 받았어요<br><em>아직 예약 전</em>이에요`; sub = '예약하면 어디로, 언제 가는지 알려드릴게요.'; }
  else if (g.st === '예약 완료'){ h = `${esc(josa(w, '이', '가'))} ${josa(v.name, '을', '를')}<br>예약했어요`; sub = `${mdw(r.in)} 체크인 · 1박`; }
  else if (g.st === '이용 완료'){ h = `${esc(josa(w, '이', '가'))} 선물로<br>${v.name}에 다녀왔어요`; sub = `${mdw(r.in)} – ${mdw(r.in + 1)} · 1박`; }
  else if (g.st === '노쇼'){ h = `${esc(josa(w, '이', '가'))} 예약한 날<br>입실하지 않았어요`; sub = '예약한 날이 지나 1박은 돌아오지 않아요.'; }
  else { h = '48시간 안에 예약하지 않아<br>1박이 돌아왔어요'; sub = `${g.type} 잔여 숙박일에 다시 더했어요.`; }

  const stepDone = {'발송 전':0,'발송됨':1,'사용 가능':2,'예약 완료':3,'이용 완료':4,'노쇼':3,'회수 완료':g.reg ? 2 : 1}[g.st];
  const tick = ICON.tick;
  const li = (i, t, s, d) => `<li class="${i < stepDone || (i === 3 && g.st === '이용 완료') ? 'done' : i === stepDone && isOpen(g) ? 'now' : ''}"><span class="n">${i < stepDone || (i === 3 && g.st === '이용 완료') ? tick : i + 1}</span><div><b>${t}</b>${s ? `<small>${s}</small>` : ''}</div><span class="d">${d || ''}</span></li>`;
  let steps = li(0, g.st === '발송 전' ? '선물 만들기' : '카카오톡으로 보냄', `${g.type} 1박`, dayOf(g.made))
    + li(1, g.reg ? '받는 분이 등록' : '받는 분 등록', g.reg ? `${esc(g.reg)} 계정으로 등록` : '', g.regAt != null ? dayOf(g.regAt) : '');
  if (g.st === '회수 완료') steps += `<li class="back"><span class="n">${GI.back}</span><div><b>기한 지나서 1박 반환</b><small>${g.type} 잔여 숙박일에 더함</small></div><span class="d">${dayOf(g.backAt)}</span></li>`;
  else steps += li(2, r ? `${v.region} ${v.name} 예약` : '예약', r ? `${mdw(r.in)} 체크인` : `${hm(g.made + LIMIT)}까지`, r ? dayOf(r.at) : '')
    + (g.st === '노쇼' ? `<li class="back"><span class="n">${ICON.x}</span><div><b>입실하지 않음</b><small>1박은 돌아오지 않아요</small></div><span class="d">${md(r.in)}</span></li>`
      : li(3, '이용 완료', g.st === '이용 완료' ? '체크아웃했어요' : '', g.st === '이용 완료' ? md(r.in + 1) : r ? `${md(r.in + 1)} 예정` : ''));

  const clock = isOpen(g) ? `<div class="clock ${hoursLeft(g) < 12 ? 'hot' : ''}"><div><small>예약 기한</small><b>${hm(g.made + LIMIT)}</b></div><span class="left num">${leftTxt(g)}</span></div>` : '';
  const cta = g.st === '발송 전' ? `<div class="cta"><button class="btn kakao" data-share>${GI.kakao}카카오톡으로 보내기</button></div>`
    : g.st === '발송됨' || g.st === '사용 가능' ? `<div class="cta"><button class="btn" data-share>${g.st === '발송됨' ? '링크 다시 보내기' : '예약해 달라고 다시 알리기'}</button></div>` : '';
  return frame('', `
    <div class="h2">${h}<small>${sub}</small></div>
    ${clock}
    <ol class="track">${steps}</ol>
    <div class="hr8"></div>
    <div class="kv2">
      <div><span>숙박권</span><b>${g.type} 1박</b></div>
      <div><span>받는 분</span><b>${g.reg ? esc(g.reg) : '등록 전'}${g.memo ? `<span style="color:var(--ink-3);font-weight:500"> · ${esc(g.memo)}</span>` : ''}</b></div>
      <div><span>선물한 날</span><b>${hm(g.made)}</b></div>
      <div><span>선물 번호</span><b class="num" style="color:var(--ink-3);font-weight:500">${g.id}</b></div>
    </div>`, cta);
}

/* ---------- 받는 분 쪽 이벤트 (시안 조작) ---------- */
const NAMES = ['김수아','이도윤','박서진','정하린','최민재'];
function nextDay(type){ for (let o = 2; o < 40; o++) if (isWeekend(o) === (type === '주말')) return o; return 3; }
const EV = {
  reg:   {lb:'받는 분이 링크를 열고 등록', ok:g => g.st === '발송됨',
          run:g => { g.reg = g.reg || NAMES[D.gifts.indexOf(g) % NAMES.length]; g.regAt = NOW; g.st = '사용 가능'; return [`${josa(who(g), '이', '가')} 선물을 받았어요`, '48시간 안에 예약하면 선물이 완료돼요.']; }},
  book:  {lb:'받는 분이 예약', ok:g => g.st === '사용 가능',
          run:g => { g.res = {v:g.type === '주말' ? 'v6' : 'v3', in:nextDay(g.type), at:NOW}; g.st = '예약 완료'; const v = vById[g.res.v]; return [`${josa(who(g), '이', '가')} ${josa(v.name, '을', '를')} 예약했어요`, `${mdw(g.res.in)} 체크인 · 선물한 ${g.type} 1박`]; }},
  out:   {lb:'받는 분이 체크아웃 (이용 완료)', ok:g => g.st === '예약 완료',
          run:g => { g.st = '이용 완료'; return [`${josa(who(g), '이', '가')} 선물로 다녀왔어요`, `${vById[g.res.v].name}에서 체크아웃했어요.`]; }},
  noshow:{lb:'받는 분이 입실하지 않음', ok:g => g.st === '예약 완료',
          run:g => { g.st = '노쇼'; return [`${josa(who(g), '이', '가')} 입실하지 않았어요`, '예약한 날이 지나 선물이 끝났어요.']; }},
  expire:{lb:'예약 없이 48시간이 지남', ok:g => isOpen(g),
          run:g => { g.st = '회수 완료'; g.backAt = g.made + LIMIT; D.left[g.type]++; return [`${g.type} 1박이 돌아왔어요`, `${josa(who(g), '이', '가')} 48시간 안에 예약하지 않았어요.`]; }},
};
const simTarget = () => { const c = cur(); if (c.s === 'detail') return gById(c.g); return D.gifts.filter(isOpen).sort((a, b) => hoursLeft(a) - hoursLeft(b))[0] || D.gifts.find(g => g.st === '예약 완료'); };

function side(){
  const g = simTarget(), acts = g ? Object.entries(EV).filter(([, e]) => e.ok(g)) : [];
  $('side').innerHTML = `
    <a href="../">${LOGO}</a>
    <h1>선물한 숙박권이<br>어디까지 쓰였는지 보여요</h1>
    <p>MY의 숙박권 선물하기에서 보낸 선물마다 받았는지, 예약했는지, 다녀왔는지 보여줘요. 상태가 바뀌면 푸시로도 알려드려요.</p>
    <div class="grp"><b>오너 회원 상태</b><div class="seg">${['이용 가능','관리비 미납','사용 시작 전'].map(x => `<button data-m="${x}" class="${D.member === x ? 'on' : ''}">${x}</button>`).join('')}</div></div>
    <div class="sim">
      <div class="tg">받는 분 쪽에서 일어나는 일<small>${g ? `${esc(who(g))} · ${g.type} 1박 · 지금 ${g.st}` : '진행 중인 선물이 없어요. 새로 선물해 보세요.'}</small></div>
      ${acts.length ? `<div class="acts">${acts.map(([k, e]) => `<button class="btn" data-ev="${k}">${ICON.chev}${e.lb}</button>`).join('')}</div>` : ''}
    </div>
    <div class="links"><a href="corp">회사 숙박권 앱</a><a href="../admin/">관리자</a><button id="reset">시안 초기화</button></div>`;
}
$('side').addEventListener('click', e => {
  const m = e.target.closest('[data-m]'); if (m){ D.member = m.dataset.m; saveD(); return draw(); }
  const ev = e.target.closest('[data-ev]'); if (ev){
    const g = simTarget(), [t, p] = EV[ev.dataset.ev].run(g); saveD(); draw(); pushNoti(t, p, g.id); return;
  }
  if (e.target.id === 'reset'){ try { localStorage.removeItem(KEY); } catch(x){} D = SEED(); stack = [{s:'my'}]; draw(); }
});

/* ---------- 공통 ---------- */
function draw(){
  $('scr').innerHTML = {my:sMy, gifts:sGifts, new:sNew, detail:sDetail}[cur().s]();
  side();
}
function ptoast(m){ $('scr').querySelectorAll('.ptoast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'ptoast'; t.innerHTML = ICON.check + `<span>${m}</span>`; $('scr').appendChild(t); setTimeout(() => t.remove(), 2200); }
let pushT;
function pushNoti(title, text, gid){
  $('scr').querySelectorAll('.push').forEach(x => x.remove()); clearTimeout(pushT);
  const p = document.createElement('div'); p.className = 'push';
  p.innerHTML = `<img src="../assets/vacon-logo-stacked.svg" alt=""><div class="tx"><div class="top"><span>베이컨하우스</span><span>지금</span></div><b>${esc(title)}</b><p>${esc(text)}</p></div>`;
  p.onclick = () => { p.remove(); stack = [{s:'my'}, {s:'gifts'}, {s:'detail', g:gid}]; draw(); };
  $('scr').appendChild(p); pushT = setTimeout(() => p.remove(), 4200);
}
function shareSheet(g, fresh){
  const d = document.createElement('div'); d.className = 'shscrim';
  d.innerHTML = `<div class="sheet"><h3>${fresh ? '선물을 만들었어요<br>카카오톡으로 보내 주세요' : '카카오톡으로 다시 보낼게요'}</h3><p>${fresh ? `${g.type} 잔여 숙박일에서 1박이 빠졌어요. ` : ''}${hm(g.made + LIMIT)}까지 예약하지 않으면 1박이 돌아와요.</p>
    <div class="card"><span class="ic">${GI.gift}</span><div><b>베이컨하우스 ${g.type} 숙박권 1박</b><small>${OWNER.name}님이 보낸 선물</small></div></div>
    <button class="btn kakao" data-y>${GI.kakao}카카오톡으로 보내기</button>${fresh ? '<button class="btn ghost" data-x>나중에 보낼게요</button>' : '<button class="btn ghost" data-x>닫기</button>'}</div>`;
  d.onclick = e => {
    if (e.target === d || e.target.closest('[data-x]')){ d.remove(); if (fresh) ptoast('선물함에서 언제든 보낼 수 있어요'); return; }
    if (e.target.closest('[data-y]')){ d.remove(); if (g.st === '발송 전'){ g.st = '발송됨'; g.sent = NOW; } saveD(); draw(); ptoast('카카오톡으로 보냈어요'); }
  };
  $('scr').appendChild(d);
}

$('scr').addEventListener('click', e => {
  const t = e.target, c = cur();
  if (t.closest('[data-back]')) return pop();
  const so = t.closest('[data-soon]'); if (so) return ptoast(`${so.dataset.soon} 화면은 이 시안에 없어요`);
  const go = t.closest('[data-go]'); if (go) return push({s:go.dataset.go});
  const g = t.closest('[data-g]'); if (g) return push({s:'detail', g:g.dataset.g});
  const ty = t.closest('[data-type]'); if (ty && !ty.disabled){ c.memo = $('memo')?.value; c.type = ty.dataset.type; return draw(); }
  if (t.closest('[data-make]')){
    const memo = ($('memo')?.value || '').trim();
    const n = D.gifts.length + 4480;
    const ng = {id:`G-2609-${n}`, type:c.type, memo, made:NOW, st:'발송 전'};
    D.left[c.type]--; D.gifts.unshift(ng); saveD();
    stack = [{s:'my'}, {s:'gifts'}, {s:'detail', g:ng.id}]; draw();
    return shareSheet(ng, true);
  }
  if (t.closest('[data-share]')) return shareSheet(gById(c.g), false);
});

/* 케이스 바로가기: #s=gifts|new|detail&g=G-...&m=관리비 미납 */
{ const P = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(x => { const [k, ...v] = x.split('='); return [k, decodeURIComponent(v.join('='))]; }));
  if (P.m) D.member = P.m;
  if (P.s === 'gifts') stack.push({s:'gifts'});
  if (P.s === 'new') stack.push({s:'gifts'}, {s:'new'});
  if (P.s === 'detail') stack.push({s:'gifts'}, {s:'detail', g:P.g || D.gifts[0].id});
}
draw();
</script>
</body>
</html>
