<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/vacon-logo-stacked.svg" type="image/svg+xml">
<title>베이컨하우스 숙박권 선물하기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../admin/admin.css">
<style>
body{background:#fff}
.stage{min-height:100vh;display:flex;justify-content:center;align-items:center;gap:64px;padding:40px 24px;flex-wrap:wrap}
/* side panel */
.side2{width:340px;display:flex;flex-direction:column;gap:20px}
.side2 .logo-svg{width:120px}
.side2 h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.side2 p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.6}
.grp{display:flex;flex-direction:column;gap:8px}
.grp > b{font-size:13px;color:var(--ink-3);font-weight:600}
.sim{background:var(--surface-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sim .tg{font-size:14px;font-weight:600}
.sim .tg small{display:block;font-size:13px;font-weight:500;color:var(--ink-3)}
.sim .acts{display:flex;flex-direction:column;gap:6px}
.sim .acts .btn{justify-content:flex-start;background:#fff;height:42px;border-radius:12px}
.sim .acts .btn:hover{background:var(--surface-3)}
.links{display:flex;gap:14px;font-size:13px}
.links a,.links button{color:var(--ink-3);font-weight:600;text-decoration:none;background:none;border:0;padding:0;font-size:13px}

/* phone */
.phone{width:390px;height:820px;border-radius:52px;background:#1A1A1E;padding:12px;box-shadow:0 30px 80px rgba(26,26,30,.22);flex:none}
.scr{width:100%;height:100%;border-radius:42px;background:#fff;overflow:hidden;position:relative;display:flex;flex-direction:column}
.sbar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-size:15px;font-weight:600;flex:none}
.sbi{display:flex;gap:6px;align-items:center}
.nav2{height:52px;display:flex;align-items:center;gap:4px;padding:0 12px;flex:none}
.nav2 .bk{all:unset;cursor:pointer;width:36px;height:40px;display:grid;place-items:center;border-radius:12px}
.nav2 .bk svg{width:24px;height:24px}
.nav2 b{font-size:18px;font-weight:700}
.body{flex:1;overflow:auto;padding:4px 20px 24px}
.body::-webkit-scrollbar{display:none}
.tabbar{height:78px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:18px;flex:none}
.tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-4)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--ink)}

/* MY (기존 화면 구성) */
.myh{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}
.myh b{font-size:22px;letter-spacing:-.02em}
.plan{display:inline-block;background:#6D5DF6;color:#fff;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px}
.prof{display:flex;justify-content:space-between;align-items:center;margin:6px 0 20px}
.prof b{display:block;font-size:20px;letter-spacing:-.02em;margin-top:6px}
.prof small{font-size:14px;color:var(--ink-3)}
.prof .btn{height:34px;border-radius:999px;font-size:13.5px}
.box{background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(26,26,30,.08);padding:18px 20px;margin-bottom:14px}
.box > h4{margin:0 0 12px;font-size:15px;font-weight:600}
.box > h5{margin:0 0 4px;font-size:14px;font-weight:500;color:var(--ink-3)}
.left3{display:grid;grid-template-columns:repeat(3,1fr)}
.left3 div + div{border-left:1px solid var(--line);padding-left:16px}
.left3 small{display:block;font-size:13.5px;color:var(--ink-3)}
.left3 b{font-size:20px}
.left3 b span{font-size:13.5px;color:var(--ink-3);font-weight:500;margin-left:2px}
.mrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;height:52px;font-size:16px;font-weight:600}
.mrow .l{flex:1}
.mrow .r{font-size:14px;color:var(--accent-ink);font-weight:600}
.mrow svg{width:18px;height:18px;color:var(--ink-4)}
.logout{font-size:14px;color:var(--ink-3);text-decoration:underline;margin:10px 0 0;display:inline-block}

/* 상태 배지 · 진행 막대 */
.bd.orange{background:var(--accent-2);color:var(--accent-ink)}
.step{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.step i{height:4px;border-radius:2px;background:var(--surface-3)}
.step i.on{background:var(--accent)}
.step.green i.on{background:var(--ok)}
.step.grey i.on{background:var(--ink-4)}
.stepl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.stepl span{font-size:13px;color:var(--ink-4);font-weight:500}
.stepl span.on{color:var(--ink-2)}
.stepl span.cur{color:var(--ink);font-weight:700}

/* 선물 내역 */
.gc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%;padding:20px 0;border-bottom:1px solid var(--line)}
.gc:last-child{border-bottom:0}
.gc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gc .due{font-size:14px;color:var(--ink-2);font-weight:500}
.gc .due.hot{color:var(--accent-ink);font-weight:600}
.gc b{font-size:17px;font-weight:700}
.gc small{font-size:14px;color:var(--ink-3)}
.gc .when{margin-top:10px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-bottom:40px}
.empty b{font-size:18px}
.empty span{font-size:15px;color:var(--ink-3);line-height:1.5}
.empty .btn{margin-top:18px;border-radius:999px;height:44px;padding:0 18px;background:var(--ink);color:#fff}

/* 선물 상세 */
.dt .bd{margin:8px 0 18px}
.note{background:var(--surface-2);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--ink-2);text-align:center;line-height:1.55;margin-top:20px}
.dt h4{margin:28px 0 6px;font-size:17px;font-weight:700}
.kv2{display:flex;flex-direction:column}
.kv2 div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:15px}
.kv2 span{color:var(--ink-3);flex:none}
.kv2 b{font-weight:500;text-align:right}
.kv2 em{font-style:normal;color:var(--accent-ink);font-weight:600}
.dt hr{border:0;border-top:1px solid var(--line);margin:18px 0 0}
.msg{font-size:15px;line-height:1.6;margin:4px 0 0}

/* push, toast */
.push{position:absolute;left:10px;right:10px;top:8px;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-radius:22px;padding:12px 14px;display:flex;gap:12px;box-shadow:0 12px 32px rgba(26,26,30,.18);cursor:pointer;animation:drop .35s ease-out}
.push img{width:38px;height:38px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);padding:5px;flex:none}
.push .tx{flex:1;min-width:0}
.push .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3)}
.push b{display:block;font-size:14.5px;margin-top:1px}
.push p{margin:1px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.4}
@keyframes drop{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
.ptoast{position:absolute;left:20px;right:20px;bottom:110px;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 28px rgba(26,26,30,.14);border-radius:16px;padding:14px 16px;font-size:14.5px;z-index:12}
@media (max-width:900px){.stage{gap:28px}.side2{width:100%;max-width:390px}}
@media (max-width:430px){.stage{padding:24px 16px}.phone{width:100%;height:760px;border-radius:44px;padding:8px}.scr{border-radius:36px}}
</style>
</head>
<body>
<div class="stage">
  <aside class="side2" id="side"></aside>
  <div class="phone"><div class="scr" id="scr"></div></div>
</div>
<script src="../admin/data.js"></script>
<script>
const $ = id => document.getElementById(id);
/* 시간: 9.28 00:00 기준 시각(h). 지금은 9.28 14:00. 받는 분은 보낸 뒤 48시간 안에 예약해야 해요 */
const NOW = 14, LIMIT = 48;
const pad = n => String(n).padStart(2, '0');
const dt = h => { const d = dOf(Math.floor(h / 24)); return d; };
const ymd = h => { const d = dt(h); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; };
const ymdhm = h => { const m = ((h % 24) + 24) % 24; return `${ymd(h)} ${pad(Math.floor(m))}:${m % 1 ? '30' : '00'}`; };

/* ---------- 데이터 ---------- */
const KEY = 'vh-gift-v2';
const VILLA = '가평 소석원';
const SEED = () => ({
  left: {평일: 6, 주말: 6},
  gifts: [
    {id:'G-2609-4471', type:'평일', name:'김수아', phone:'010-2231-4471', msg:'생일 축하해! 베이컨 숙박권으로 어디 여행이라도 다녀와 :)', sent:NOW - 43.5, st:'sent'},
    {id:'G-2609-4402', type:'주말', name:'이현우', phone:'010-5580-4402', msg:'이번 주말에 푹 쉬고 와요.', sent:NOW - 18, recvAt:NOW - 15.5, st:'recv'},
    {id:'G-2609-3318', type:'주말', name:'김지민', phone:'010-3318-2207', msg:'', sent:-196, recvAt:-193, st:'booked', res:{in:5, at:-180}},
    {id:'G-2609-2210', type:'평일', name:'박미정', phone:'010-2210-9981', msg:'엄마 늘 고마워요.', sent:-652, recvAt:-640, st:'used', res:{in:-13, at:-620}},
    {id:'G-2609-1187', type:'주말', name:'정하린', phone:'010-1187-3320', msg:'', sent:-436, st:'expired'},
  ],
});
let D; try { D = JSON.parse(localStorage.getItem(KEY)) || SEED(); } catch(e){ D = SEED(); }
let CASE = null; /* 케이스 링크로 열면 저장하지 않고 이 탭에서만 보여줘요 */
const saveD = () => { if (CASE) return; try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(e){} };
const gById = id => D.gifts.find(g => g.id === id);
const isOpen = g => g.st === 'sent' || g.st === 'recv';
const hoursLeft = g => Math.max(0, g.sent + LIMIT - NOW);
const leftTxt = g => { const h = hoursLeft(g); return h < 1 ? '만료까지 1시간 미만' : `만료까지 ${Math.floor(h)}시간`; };
const isWeekend = o => [5, 6].includes(dOf(o).getDay());

/* 상태: 배지 이름과 색, 진행 단계(발송 · 수령 · 예약 · 사용) */
const ST = {
  sent:   {lb:'발송완료', c:'orange', step:1},
  recv:   {lb:'수령완료', c:'orange', step:2},
  booked: {lb:'예약완료', c:'green',  step:3},
  used:   {lb:'사용완료', c:'green',  step:4},
  noshow: {lb:'미입실',   c:'grey',   step:3},
  expired:{lb:'기간만료', c:'grey',   step:0},
};
const doneOf = g => g.st === 'expired' ? (g.recvAt != null ? 2 : 1) : ST[g.st].step;
const badge = g => `<span class="bd ${ST[g.st].c}">${ST[g.st].lb}</span>`;
const bar = g => { const n = doneOf(g); return `<div class="step ${ST[g.st].c}">${[0,1,2,3].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`; };
function barLabels(g){
  const n = doneOf(g), names = ['발송', '수령', '예약', '사용'];
  if (g.st === 'expired') names[n] = '만료';
  if (g.st === 'noshow') names[3] = '미입실';
  const stop = g.st === 'expired' || g.st === 'noshow' ? n : -1;
  return `<div class="stepl">${names.map((t, i) => `<span class="${i === stop || (i === n - 1 && stop < 0) ? 'cur' : i < n ? 'on' : ''}">${t}</span>`).join('')}</div>`;
}
/* 목록 오른쪽 한 줄: 기한이 있으면 남은 시간, 예약했으면 날짜 */
function dueOf(g){
  if (isOpen(g)) return `<span class="due hot">${leftTxt(g)}</span>`;
  if (g.st === 'booked') return `<span class="due">${md(g.res.in)} 체크인</span>`;
  if (g.st === 'used') return `<span class="due">${md(g.res.in + 1)} 체크아웃</span>`;
  return '';
}

/* ---------- 화면 스택 ---------- */
let stack = [{s:'my'}];
const cur = () => stack[stack.length - 1];
const push = o => { stack.push(o); draw(); $('scr').querySelector('.body')?.scrollTo(0, 0); };
const pop = () => { if (stack.length > 1) stack.pop(); draw(); };

function frame(title, body, tab = false){
  return `<div class="sbar"><span>9:41</span><span class="sbi"><svg viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12" width="26" height="12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.6" fill="currentColor"/><path d="M24 4v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".4"/></svg></span></div>
    ${title !== null ? `<div class="nav2"><button class="bk" data-back aria-label="뒤로">${ICON.back}</button><b>${title}</b></div>` : ''}
    <div class="body">${body}</div>
    ${tab ? `<nav class="tabbar">
      <button data-soon="홈"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>홈</button>
      <button data-soon="탐색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4" stroke-linecap="round"/></svg>탐색</button>
      <button data-soon="예약내역"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="16" height="15" rx="3"/><rect x="7" y="3" width="2" height="4" rx="1"/><rect x="15" y="3" width="2" height="4" rx="1"/></svg>예약내역</button>
      <button class="on"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6z"/></svg>MY</button></nav>` : ''}`;
}

/* ---------- 화면 ---------- */
function sMy(){
  const open = D.gifts.filter(isOpen).length;
  const row = (lb, attr, r = '') => `<button class="mrow" ${attr}><span class="l">${lb}</span>${r}${ICON.chev}</button>`;
  return frame(null, `
    <div class="myh"><b>MY</b></div>
    <div class="prof"><div><span class="plan">Residence Plan</span><b>김모모님</b><small>vacon@gmail.com</small></div><button class="btn" data-soon="관리">관리</button></div>
    <div class="box"><h4>잔여 숙박일</h4><div class="left3">
      <div><small>평일</small><b class="num">${D.left.평일}<span>/8박</span></b></div>
      <div><small>주말</small><b class="num">${D.left.주말}<span>/8박</span></b></div>
      <div><small>구좌</small><b class="num">1<span>구</span></b></div></div></div>
    <div class="box"><h5>예약/ 이용</h5>
      ${row('예약 내역', 'data-soon="예약 내역"')}
      ${row('선물하기', 'data-soon="선물하기"')}
      ${row('선물내역', 'data-go="gifts"', open ? `<span class="r">진행 중 ${open}</span>` : '')}
      ${row('찜 목록', 'data-soon="찜 목록"')}</div>
    <div class="box"><h5>오너십/ 결제</h5>
      ${row('오너십 관리', 'data-soon="오너십 관리"')}
      ${row('결제 내역', 'data-soon="결제 내역"')}</div>
    <a class="logout" href="#" data-soon="로그아웃">로그아웃</a>`, true);
}

function sGifts(){
  if (!D.gifts.length) return frame('선물 내역', `<div class="empty"><b>선물 내역이 없어요</b><span>선물하기로 소중한 분에게<br>숙박권을 보내 보세요</span><button class="btn" data-soon="선물하기">선물하러 가기</button></div>`);
  const list = [...D.gifts.filter(isOpen).sort((a, b) => hoursLeft(a) - hoursLeft(b)), ...D.gifts.filter(g => !isOpen(g)).sort((a, b) => b.sent - a.sent)];
  return frame('선물 내역', list.map(g => `<button class="gc" data-g="${g.id}">
      <span class="top">${badge(g)}${dueOf(g)}</span>
      <b>${esc(g.name)}</b>
      <small>${g.type} 1박 · ${VILLA}</small>
      <small class="when">${ymd(g.sent)} 발송</small></button>`).join(''));
}

function sDetail(){
  const g = gById(cur().g), r = g.res;
  const note = g.st === 'expired' ? `48시간 안에 예약하지 않아 만료됐어요.<br>${g.type} 1박은 잔여 숙박일로 돌아왔어요.`
    : g.st === 'noshow' ? '예약한 날 입실하지 않았어요.<br>사용한 숙박일은 돌아오지 않아요.' : '';
  const row = (k, v) => `<div><span>${k}</span><b>${v}</b></div>`;
  return frame('선물 상세', `<div class="dt">
    ${badge(g)}
    ${bar(g)}${barLabels(g)}
    ${note ? `<div class="note">${note}</div>` : ''}
    <h4>선물 정보</h4>
    <div class="kv2">
      ${row('받는 분', esc(g.name))}
      ${row('휴대폰번호', g.phone)}
      ${row('숙박권', `${g.type} 1박 · ${VILLA}`)}
      ${row('발송 일시', ymdhm(g.sent))}
      ${r ? row('예약 일정', `${mdw(r.in)} – ${mdw(r.in + 1)}`) : row('만료 일시', ymdhm(g.sent + LIMIT) + (isOpen(g) ? `<br><em>${leftTxt(g)}</em>` : ''))}
    </div>
    ${g.msg ? `<hr><h4>메시지</h4><p class="msg">${esc(g.msg)}</p>` : ''}</div>`);
}

/* ---------- 받는 분 쪽 이벤트 (시안 조작) ---------- */
function nextDay(type){ for (let o = 2; o < 40; o++) if (isWeekend(o) === (type === '주말')) return o; return 3; }
const nim = g => josa(g.name + '님', '이', '가');
const EV = {
  recv:  {lb:'받는 분이 선물을 받음', ok:g => g.st === 'sent',
          run:g => { g.recvAt = NOW; g.st = 'recv'; return [`${nim(g)} 선물을 받았어요`, `${ymdhm(g.sent + LIMIT)}까지 예약할 수 있어요.`]; }},
  book:  {lb:'받는 분이 예약', ok:g => g.st === 'recv',
          run:g => { g.res = {in:nextDay(g.type), at:NOW}; g.st = 'booked'; return [`${nim(g)} 소석원을 예약했어요`, `${mdw(g.res.in)} 체크인`]; }},
  out:   {lb:'받는 분이 체크아웃', ok:g => g.st === 'booked',
          run:g => { g.st = 'used'; return [`${nim(g)} 선물을 사용했어요`, '소석원에서 체크아웃했어요.']; }},
  noshow:{lb:'받는 분이 입실하지 않음', ok:g => g.st === 'booked',
          run:g => { g.st = 'noshow'; return [`${nim(g)} 입실하지 않았어요`, '사용한 숙박일은 돌아오지 않아요.']; }},
  expire:{lb:'예약 없이 48시간이 지남', ok:g => isOpen(g),
          run:g => { g.st = 'expired'; D.left[g.type]++; return ['선물이 기간만료됐어요', `${g.type} 1박이 잔여 숙박일로 돌아왔어요.`]; }},
};
const simTarget = () => { const c = cur(); if (c.s === 'detail') return gById(c.g); return D.gifts.filter(isOpen).sort((a, b) => hoursLeft(a) - hoursLeft(b))[0] || D.gifts.find(g => g.st === 'booked'); };

function side(){
  const g = simTarget(), acts = g ? Object.entries(EV).filter(([, e]) => e.ok(g)) : [];
  $('side').innerHTML = `
    <a href="../">${LOGO}</a>
    <h1>선물내역에서<br>상태를 바로 확인해요</h1>
    <p>보낸 선물마다 발송, 수령, 예약, 사용 중 어디까지 왔는지 보여줘요.</p>
    <div class="sim">
      <div class="tg">받는 분 쪽에서 일어나는 일<small>${g ? `${esc(g.name)} · ${g.type} 1박 · 지금 ${ST[g.st].lb}` : '진행 중인 선물이 없어요.'}</small></div>
      ${acts.length ? `<div class="acts">${acts.map(([k, e]) => `<button class="btn" data-ev="${k}">${e.lb}</button>`).join('')}</div>` : ''}
    </div>
    <div class="grp"><b>케이스 바로 보기</b><select id="case" class="inp" style="height:44px;border-radius:12px;border:0;background:var(--surface-2);padding:0 12px;font-size:14px;font-weight:600"><option value="">직접 눌러 보기</option>${CASES.map(([id, lb]) => `<option value="${id}" ${CASE === id ? 'selected' : ''}>${lb}</option>`).join('')}</select></div>
    <div class="links"><a href="../admin/">관리자</a><button id="reset">시안 초기화</button></div>`;
}
$('side').addEventListener('change', e => { if (e.target.id === 'case'){ location.hash = e.target.value; location.reload(); } });
$('side').addEventListener('click', e => {
  const ev = e.target.closest('[data-ev]'); if (ev){
    const g = simTarget(), [t, p] = EV[ev.dataset.ev].run(g); saveD(); draw(); pushNoti(t, p, g.id); return;
  }
  if (e.target.id === 'reset'){ try { localStorage.removeItem(KEY); } catch(x){} history.replaceState(null, '', location.pathname); location.reload(); }
});

/* ---------- 공통 ---------- */
function draw(){
  $('scr').innerHTML = {my:sMy, gifts:sGifts, detail:sDetail}[cur().s]();
  side();
}
function ptoast(m){ $('scr').querySelectorAll('.ptoast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'ptoast'; t.textContent = m; $('scr').appendChild(t); setTimeout(() => t.remove(), 2200); }
let pushT;
function pushNoti(title, text, gid){
  $('scr').querySelectorAll('.push').forEach(x => x.remove()); clearTimeout(pushT);
  const p = document.createElement('div'); p.className = 'push';
  p.innerHTML = `<img src="../assets/vacon-logo-stacked.svg" alt=""><div class="tx"><div class="top"><span>베이컨하우스</span><span>지금</span></div><b>${esc(title)}</b><p>${esc(text)}</p></div>`;
  p.onclick = () => { p.remove(); stack = [{s:'my'}, {s:'gifts'}, {s:'detail', g:gid}]; draw(); };
  $('scr').appendChild(p); pushT = setTimeout(() => p.remove(), 4200);
}

$('scr').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-back]')) return pop();
  const so = t.closest('[data-soon]'); if (so){ e.preventDefault(); return ptoast(`${so.dataset.soon}는 기존 화면을 그대로 써요`); }
  const go = t.closest('[data-go]'); if (go) return push({s:go.dataset.go});
  const g = t.closest('[data-g]'); if (g) return push({s:'detail', g:g.dataset.g});
});

/* ---------- 케이스 링크: #c-list 처럼 열면 그 상황으로 바로 시작 ---------- */
const G = id => D.gifts.find(g => g.id === id);
const TO = (...st) => { stack = [{s:'my'}, ...st]; };
const CASES = [
  ['c-my',      'MY에서 선물내역 진입',        () => TO()],
  ['c-list',    '선물 내역',                  () => TO({s:'gifts'})],
  ['c-empty',   '선물 내역이 없는 경우',       () => { D.gifts = []; TO({s:'gifts'}); }],
  ['c-sent',    '발송완료',                   () => { G('G-2609-4471').sent = NOW - 10; TO({s:'gifts'}, {s:'detail', g:'G-2609-4471'}); }],
  ['c-urgent',  '발송완료 · 만료 12시간 전',   () => TO({s:'gifts'}, {s:'detail', g:'G-2609-4471'})],
  ['c-recv',    '수령완료',                   () => TO({s:'gifts'}, {s:'detail', g:'G-2609-4402'})],
  ['c-booked',  '예약완료',                   () => TO({s:'gifts'}, {s:'detail', g:'G-2609-3318'})],
  ['c-used',    '사용완료',                   () => TO({s:'gifts'}, {s:'detail', g:'G-2609-2210'})],
  ['c-noshow',  '미입실',                     () => { const g = G('G-2609-3318'); g.st = 'noshow'; g.res.in = -2; TO({s:'gifts'}, {s:'detail', g:g.id}); }],
  ['c-expired', '기간만료',                   () => TO({s:'gifts'}, {s:'detail', g:'G-2609-1187'})],
  ['c-push',    '상태가 바뀌면 받는 알림',      () => { G('G-2609-4471').sent = NOW - 10; TO({s:'gifts'}); return () => { const g = G('G-2609-4471'), [t, p] = EV.recv.run(g); draw(); pushNoti(t, p, g.id); }; }],
];
{ const h = location.hash.slice(1), k = CASES.find(x => x[0] === h);
  if (k){ CASE = h; D = SEED(); const after = k[2](); draw(); after && after(); }
  else draw();
}
addEventListener('hashchange', () => location.reload());
</script>
</body>
