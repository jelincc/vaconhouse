<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/vacon-logo-stacked.svg" type="image/svg+xml">
<title>베이컨하우스 회사 숙박권</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../admin/admin.css">
<style>
body{background:#fff}
.stage{min-height:100vh;display:flex;justify-content:center;align-items:center;gap:64px;padding:40px 24px;flex-wrap:wrap}
/* side panel */
.side2{width:360px;display:flex;flex-direction:column;gap:18px}
.side2 .logo-svg{width:120px}
.side2 h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.side2 p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.6}
.persona{display:flex;flex-direction:column;gap:8px}
.persona button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.persona button:hover{background:var(--surface-2)}
.persona button.on{box-shadow:none;background:var(--surface-2)}
.persona button.on .av{background:var(--ink);color:#fff}
.persona .av{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--ink-2);flex:none}
.persona .tx{display:flex;flex-direction:column}
.persona .tx b{font-size:15px}
.persona .tx small{font-size:14px;color:var(--ink-3)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:12px;padding-bottom:14px;position:relative}
.steps li::before{content:"";position:absolute;left:12px;top:26px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .n{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--ink-3);font-size:13px;font-weight:700;display:grid;place-items:center}
.steps li.done .n{background:var(--ink);color:#fff}
.steps li.now .n{background:var(--accent);color:#fff}
.steps b{font-size:14.5px;display:block;margin-top:2px}
.steps small{font-size:14px;color:var(--ink-3)}
.steps .n svg{width:14px;height:14px}
.steps a svg{width:13px;height:13px;vertical-align:-2px}
.sbi{display:flex;gap:6px;align-items:center}
.steps a{font-size:14px;font-weight:600;color:var(--accent-ink);text-decoration:none}
.links{display:flex;gap:14px;font-size:14px}
.links a,.links button{color:var(--ink-3);font-weight:600;text-decoration:none;background:none;border:0;padding:0;font-size:14px}

/* phone */
.phone{width:390px;height:820px;border-radius:52px;background:#1A1A1E;padding:12px;box-shadow:0 30px 80px rgba(26,26,30,.22)}
.scr{width:100%;height:100%;border-radius:42px;background:#fff;overflow:hidden;position:relative;display:flex;flex-direction:column}
.sbar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-size:15px;font-weight:600;flex:none}
.nav2{height:52px;display:flex;align-items:center;gap:6px;padding:0 12px;flex:none}
.nav2 .bk{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.nav2 .bk svg{width:24px;height:24px}
.nav2 b{font-size:17px;font-weight:700}
.body{flex:1;overflow:auto;padding:4px 20px 24px}
.body::-webkit-scrollbar{display:none}
.h2{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.4;margin:6px 0 18px}
.h2 small{display:block;font-size:15px;font-weight:500;color:var(--ink-3);margin-top:6px;letter-spacing:-.01em}
.sec{font-size:17px;font-weight:700;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec a,.sec button{font-size:14px;font-weight:600;color:var(--ink-3);background:none;border:0;padding:0}
.tabbar{height:78px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:18px;flex:none}
.tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-4)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--ink)}
.cta{flex:none;padding:10px 20px 30px;background:#fff;box-shadow:0 -8px 16px rgba(255,255,255,.9)}
.cta .btn{width:100%;height:56px;border-radius:16px;font-size:17px}
.cta .note{font-size:14px;color:var(--ink-3);text-align:center;margin-bottom:10px}
.cta .note b{color:var(--ink)}

/* cards */
.corp{background:var(--accent-soft);color:var(--ink);border-radius:22px;padding:20px}
.corp small{font-size:14px;color:var(--ink-3)}
.corp .big{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:4px 0 2px}
.corp .big em{font-style:normal;color:var(--accent)}
.corp .sub{font-size:14px;color:var(--ink-2)}
.corp .btn{width:100%;margin-top:16px;height:50px;border-radius:14px;background:var(--accent);color:#fff;font-size:16px}
.soft{background:var(--surface-2);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:6px}
.soft b{font-size:17px;letter-spacing:-.02em}
.soft span{font-size:14px;color:var(--ink-2);line-height:1.55}
.soft .btn{margin-top:10px;height:48px;border-radius:14px}
.soft.orange{background:var(--accent-soft)}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;padding:10px 0;width:100%}
.thumb{width:56px;height:56px;border-radius:14px;flex:none}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .tx b{font-size:16px;font-weight:600}
.row .tx small{font-size:14px;color:var(--ink-3)}
.row .chev{width:18px;height:18px;color:var(--ink-4)}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px}
.hscroll::-webkit-scrollbar{display:none}
.vcard{all:unset;cursor:pointer;flex:none;width:150px}
.vcard .img{height:110px;border-radius:16px}
.vcard b{display:block;font-size:14.5px;margin-top:8px}
.vcard small{font-size:13px;color:var(--ink-3)}
.chips{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
.chips button{flex:none;border:0;border-radius:999px;height:34px;padding:0 14px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink-2)}
.chips button.on{background:var(--ink);color:#fff}
.vbig{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;margin-bottom:18px}
.vbig .img{height:168px;border-radius:20px;position:relative}
.vbig .img span{position:absolute;left:12px;top:12px}
.vbig b{display:block;font-size:17px;margin-top:10px}
.vbig small{font-size:14px;color:var(--ink-3)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal .w{font-size:13px;color:var(--ink-3);padding:6px 0}
.cal button{all:unset;cursor:pointer;height:44px;display:grid;place-items:center;font-size:15px;font-weight:500;position:relative}
.cal button:disabled,.cal button.x{cursor:default;color:var(--ink-4)}
.cal button.x span{text-decoration:line-through}
.cal button.in-r{background:var(--accent-soft)}
.cal button.s,.cal button.e{color:#fff}
.cal button.s span,.cal button.e span{background:var(--ink);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-weight:700}
.cal button.s{background:linear-gradient(to right,transparent 50%,var(--accent-soft) 50%)}
.cal button.e{background:linear-gradient(to left,transparent 50%,var(--accent-soft) 50%)}
.cal button.s.e{background:none}
.cal button.t span::after{content:"오늘";position:absolute;bottom:0;left:0;right:0;font-size:9px;color:var(--accent)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px}
.mhead b{font-size:17px}
.mhead button{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.mhead button svg{width:16px;height:16px}
.guests{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--line);margin-top:14px}
.stepper{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:12px}
.stepper button{border:0;background:none;width:40px;height:40px;font-size:20px;color:var(--ink-2)}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.kv2{display:flex;flex-direction:column}
.kv2 div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv2 div:last-child{border-bottom:0}
.kv2 span{color:var(--ink-3)}
.kv2 b{font-weight:600;text-align:right}
.fin{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:80px}
.fin svg{width:64px;height:64px;color:var(--ok)}
.fin h2{margin:18px 0 6px;font-size:24px;font-weight:700;letter-spacing:-.03em}
.fin p{margin:0;font-size:15px;color:var(--ink-2)}
.seg2{display:flex;gap:6px;margin-bottom:10px}
.seg2 button{border:0;border-radius:999px;height:34px;padding:0 14px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink-2)}
.seg2 button.on{background:var(--ink);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.two .btn{height:50px;border-radius:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:14px;color:var(--ink-3);font-weight:500}
.field .inp{height:52px;border-radius:14px;font-size:16px}
.field .row2{display:flex;gap:8px}
.ok{font-size:14px;color:var(--ok-ink);font-weight:600}
/* sheet + toast inside phone */
.shscrim{position:absolute;inset:0;background:rgba(26,26,30,.4);z-index:10;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:26px 22px 34px}
.sheet h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.4}
.sheet p{margin:8px 0 20px;font-size:15px;color:var(--ink-2);line-height:1.55}
.sheet .two{margin-top:0}
.ptoast{position:absolute;left:20px;right:20px;bottom:96px;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 28px rgba(26,26,30,.14);border-radius:16px;padding:14px 16px;font-size:14.5px;display:flex;gap:8px;align-items:center;z-index:12}
.ptoast svg{width:20px;height:20px;color:var(--ok);flex:none}
@media (max-width:900px){.stage{gap:28px}.side2{width:100%;max-width:390px}}
</style>
</head>
<body>
<div class="stage">
  <aside class="side2" id="side"></aside>
  <div class="phone"><div class="scr" id="scr"></div></div>
</div>
<script src="../admin/data.js"></script>
<script src="../corp/corp-data.js"></script>
<script src="../admin/cases.js" defer></script>
<script>
const $ = id => document.getElementById(id);
const PERSONAS = [
  {email:'seoyun.lee@noeul.io', name:'이서윤', phone:'010-4402-1187', hint:'이용 권한이 있는 직원'},
  {email:'jihoon.park@noeul.io', name:'박지훈', phone:'010-9934-2210', hint:'소속 확인됨 · 권한 꺼짐'},
  {email:'wooseok.shin@noeul.io', name:'신우석', phone:'010-9102-3358', hint:'방금 앱에 가입한 직원'},
  {email:'hayul.baek@noeul.io', name:'백하율', phone:'010-2290-4471', hint:'소속 확인을 기다리는 직원'},
];
let who; try { who = localStorage.getItem('vh-corp-persona') || PERSONAS[0].email; } catch(e){ who = PERSONAS[0].email; }
const me = () => PERSONAS.find(p => p.email === who);
let OVR = {}; /* 케이스 보기용 임시 상태 (저장 안 함) */
const state = () => { if (OVR.state) return OVR.state; const e = empOf(who); return !e ? '미소속' : permState(e); };
const leftNow = () => OVR.left ?? nights().left;
let stack = [{s:'home'}];
const cur = () => stack[stack.length - 1];
const push = o => { stack.push(o); draw(); $('scr').querySelector('.body')?.scrollTo(0, 0); };
const pop = () => { if (stack.length > 1) stack.pop(); draw(); };
const home = () => { stack = [{s:'home'}]; draw(); };
const first = n => n.slice(1);
const IMG = v => `background:linear-gradient(140deg, ${vById[v].c}33, ${vById[v].c}AA)`;
const MY = () => corpRes().filter(r => r.email === who);

/* ---------- side panel ---------- */
function side(){
  const s = state(), e = empOf(who);
  const step = s === '미소속' ? 2 : s === '확인 대기' ? 2 : s === '권한 없음' ? 3 : 4;
  const li = (n, t, sub, extra = '') => `<li class="${n < step ? 'done' : n === step ? 'now' : ''}"><span class="n">${n < step ? ICON.tick : n}</span><div><b>${t}</b><small>${sub}</small>${extra ? `<div>${extra}</div>` : ''}</div></li>`;
  $('side').innerHTML = `
    <a href="../">${LOGO}</a>
    <h1>회사 숙박권은<br>기존 앱에서 그대로 써요</h1>
    <p>직원용 앱을 따로 만들지 않아요. 소속이 확인되고 이용 권한이 켜진 직원에게만 회사 숙박권 예약이 보여요.</p>
    <div class="persona">${PERSONAS.map(p => `<button data-p="${p.email}" class="${p.email === who ? 'on' : ''}"><span class="av">${p.name[0]}</span><span class="tx"><b>${p.name}</b><small>${(() => { const x = empOf(p.email); return !x ? '소속 확인 전' : permState(x) === '확인 대기' ? '소속 확인 대기' : permState(x) === '이용 가능' ? '이용 권한 있음' : '소속 확인됨 · 권한 꺼짐'; })()}</small></span></button>`).join('')}</div>
    <ol class="steps">
      ${li(1, '앱 가입', '기존 베이컨하우스 앱에 가입')}
      ${li(2, '소속 확인', s === '미소속' ? '앱에서 회사 이메일로 확인을 요청해요' : s === '확인 대기' ? `${e.req} 요청 · 인사팀이 확인 중` : '인사팀이 확인했어요', s === '확인 대기' ? `<a href="../corp/">기업 관리자 화면에서 확인하기 ${ICON.chev}</a>` : '')}
      ${li(3, '이용 권한', s === '권한 없음' ? '인사팀이 권한을 켜면 바로 쓸 수 있어요' : step > 3 ? `${e.since}부터 이용 가능` : '소속 확인 뒤에 켤 수 있어요', s === '권한 없음' ? `<a href="../corp/">기업 관리자 화면에서 켜기 ${ICON.chev}</a>` : '')}
      ${li(4, '앱에서 직접 예약', step === 4 ? `회사 잔여 ${leftNow()}박 안에서 승인 없이 예약` : '권한이 켜지면 예약할 수 있어요')}
    </ol>
    <div class="links"><a href="../corp/">기업 관리자 화면</a><a href="../admin/#board">본사 예약 보드</a><button id="reset">시안 초기화</button></div>`;
}
$('side').addEventListener('click', e => {
  const p = e.target.closest('[data-p]'); if (p){ OVR = {}; who = p.dataset.p; try { localStorage.setItem('vh-corp-persona', who); } catch(x){} home(); return; }
  if (e.target.id === 'reset'){ resetDemo(); try { localStorage.removeItem('vh-corp-persona'); } catch(x){} location.reload(); }
});

/* ---------- screens ---------- */
const TAB = s => ['home','my'].includes(s);
function frame(title, body, cta = '', tab = false){
  return `<div class="sbar"><span>9:41</span><span class="sbi"><svg viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12" width="26" height="12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.6" fill="currentColor"/><path d="M24 4v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".4"/></svg></span></div>
    ${title !== null ? `<div class="nav2">${stack.length > 1 ? `<button class="bk" data-back aria-label="뒤로">${ICON.back}</button>` : ''}<b>${title}</b></div>` : ''}
    <div class="body">${body}</div>${cta}
    ${tab ? `<nav class="tabbar"><button data-tab="home" class="${cur().s === 'home' ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>홈</button><button data-tab="my" class="${cur().s === 'my' ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="16" height="15" rx="3"/><rect x="7" y="3" width="2" height="4" rx="1"/><rect x="15" y="3" width="2" height="4" rx="1"/></svg>내 예약</button><button data-tab="mypage"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6z"/></svg>마이</button></nav>` : ''}`;
}
function sHome(){
  const s = state(), N = nights(), up = MY().filter(r => cst(r) === '예정' || cst(r) === '이용 중').sort((a, b) => a.in - b.in);
  let corp = '';
  const L = leftNow();
  if (s === '이용 가능') corp = L <= 0 ? `<div class="corp"><small>${COMPANY.name} 숙박권 · 회사 전체 잔여</small><div class="big">모두 썼어요</div><div class="sub">추가 숙박권은 인사팀에 문의해 주세요. 이미 잡힌 예약은 그대로예요.</div><button class="btn" disabled style="opacity:.35">회사 숙박권으로 예약하기</button></div>`
    : `<div class="corp"><small>${COMPANY.name} 숙박권 · 회사 전체 잔여</small><div class="big"><em>${L}박</em> 남았어요</div><div class="sub">${L <= 5 ? '얼마 남지 않았어요. 동료들과 나눠 쓰는 숙박권이에요.' : `${COMPANY.until}까지 · 동료들과 함께 써요`}</div><button class="btn" data-go="villas">회사 숙박권으로 예약하기</button></div>`;
  else if (s === '확인 대기') corp = `<div class="soft orange"><b>${COMPANY.name}에서 소속을 확인하고 있어요</b><span>확인되고 이용 권한이 켜지면 여기에 회사 숙박권이 생겨요. 알림으로 알려드릴게요.</span></div>`;
  else if (s === '권한 없음') corp = `<div class="soft"><b>${COMPANY.name} 소속으로 확인됐어요</b><span>인사팀에서 이용 권한을 켜면 회사 숙박권으로 예약할 수 있어요.</span></div>`;
  else corp = `<div class="soft"><b>회사에서 받은 숙박권이 있나요?</b><span>회사 이메일로 소속을 확인하면 회사 숙박권으로 예약할 수 있어요.</span><button class="btn primary" data-go="affil">소속 확인 요청하기</button></div>`;
  const recs = VILLAS.slice(0, 5);
  return frame(null, `
    <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px"><b style="font-size:20px;letter-spacing:-.02em">베이컨하우스</b><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 10a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 15 6 10"/><path d="M10 19.5a2.2 2.2 0 0 0 4 0"/></svg></div>
    <div class="h2">${first(me().name)}님,<br>이번엔 어디로 떠나볼까요?</div>
    ${corp}
    ${up.length ? `<div class="sec">다가오는 내 예약</div>${up.map(r => `<button class="row" data-open="${r.idx}"><span class="thumb" style="${IMG(r.villa)}"></span><span class="tx"><b>${vFull(r.villa)}</b><small>${mdw(r.in)} – ${mdw(r.out)} · 회사 숙박권 ${r.out - r.in}박</small></span><span class="chev">${ICON.chev}</span></button>`).join('')}` : ''}
    <div class="sec">이번 주말 머물기 좋은 별장</div>
    <div class="hscroll">${recs.map(v => `<button class="vcard" data-v="${v.id}"><div class="img" style="${IMG(v.id)}"></div><b>${v.region} ${v.name}</b><small>최대 ${v.cap}인</small></button>`).join('')}</div>`, '', true);
}
const mailOk = c => (c.mail ?? me().email).trim().toLowerCase().endsWith('@' + COMPANY.domain);
function sAffil(){
  const c = cur();
  return frame('', `
    <div class="h2">회사 소속을 확인할게요<small>회사 이메일로 인증하면 인사팀이 확인해요.</small></div>
    <div class="field"><label>회사</label><input class="inp" value="${COMPANY.name}" readonly></div>
    <div class="field"><label>회사 이메일</label><div class="row2"><input class="inp" id="mail" value="${esc(c.mail ?? me().email)}" autocomplete="off"><button class="btn" style="height:52px;border-radius:14px" data-code ${mailOk(c) ? '' : 'disabled style="height:52px;border-radius:14px;opacity:.4"'}>${c.sent ? '다시 받기' : '인증번호 받기'}</button></div>
      ${mailOk(c) ? '' : `<span class="bad" style="font-size:14px">회사 이메일(@${COMPANY.domain})로만 확인할 수 있어요. 개인 이메일은 인증되지 않아요.</span>`}</div>
    ${c.sent ? `<div class="field"><label>인증번호</label><input class="inp num" value="482913"><span class="ok">인증됐어요</span></div>` : ''}`,
    `<div class="cta"><button class="btn primary" data-req ${c.sent ? '' : 'disabled style="opacity:.35"'}>확인 요청하기</button></div>`);
}
function sVillas(){
  const c = cur(), rg = c.rg || '전체';
  const vs = VILLAS.filter(v => rg === '전체' || v.region === rg);
  const freeWeekend = v => { let o = 1; while (dOf(o).getDay() !== 5) o++; return !booked(v.id, o) || !booked(v.id, o + 1); };
  return frame('회사 숙박권 예약', `
    <div class="h2">어디로 갈까요?<small>회사 잔여 ${leftNow()}박 안에서 예약할 수 있어요.</small></div>
    <div class="chips">${['전체', ...REGIONS].map(x => `<button data-rg="${x}" class="${rg === x ? 'on' : ''}">${x}</button>`).join('')}</div>
    ${vs.map(v => `<button class="vbig" data-v="${v.id}"><div class="img" style="${IMG(v.id)}">${freeWeekend(v) ? BD('이번 주말 가능','green') : BD('이번 주말 마감','grey')}</div><b>${v.region} ${v.name}</b><small>최대 ${v.cap}인 · ${v.type === '직영' ? '베이컨하우스 직영' : '위탁 운영'}</small></button>`).join('')}`);
}
function monthGrid(c){
  const base = new Date(2026, 9 + c.m, 1);
  const s0 = new Date(base); s0.setDate(1 - base.getDay());
  let h = WD.map(w => `<span class="w">${w}</span>`).join('');
  for (let i = 0; i < 42; i++){
    const d = new Date(s0); d.setDate(s0.getDate() + i);
    if (d.getMonth() !== base.getMonth()){ h += '<span></span>'; continue; }
    const o = Math.round((d - TODAY) / 864e5);
    const past = o < 1 || o > 90, x = booked(c.v, o, c.r);
    const sel = c.a != null && (o === c.a || o === c.b), inr = c.a != null && c.b != null && o > c.a && o < c.b;
    h += `<button data-d="${o}" class="${x ? 'x' : ''} ${o === c.a ? 's' : ''} ${o === c.b || (c.b == null && o === c.a) ? 'e' : ''} ${inr ? 'in-r' : ''} ${o === 0 ? 't' : ''}" ${past || (x && c.a == null) ? 'disabled' : ''}><span>${d.getDate()}</span></button>`;
  }
  return `<div class="mhead"><button data-m="-1" ${c.m <= 0 ? 'disabled style="opacity:.3"' : ''}>${ICON.back}</button><b>${base.getFullYear()}년 ${base.getMonth() + 1}월</b><button data-m="1" ${c.m >= 1 ? 'disabled style="opacity:.3"' : ''}>${ICON.chev}</button></div><div class="cal">${h}</div>`;
}
function rangeOk(c){ if (c.a == null || c.b == null) return false; for (let o = c.a; o < c.b; o++) if (booked(c.v, o, c.r)) return false; return true; }
function sDates(){
  const c = cur(), v = vById[c.v];
  const n = c.b != null ? c.b - c.a : 0;
  const give = c.r ? c.r.out - c.r.in : 0;
  const left = leftNow() + give;
  const ok = rangeOk(c) && n <= left;
  const note = c.a == null ? '체크인 날짜를 골라 주세요' : c.b == null ? '체크아웃 날짜를 골라 주세요'
    : !rangeOk(c) ? '사이에 이미 예약된 날이 있어요' : n > left ? `회사 잔여 ${left}박보다 길어요`
    : `${mdw(c.a)} – ${mdw(c.b)} · 숙박권 <b>${n}박</b> · 예약 후 잔여 <b>${left - n}박</b>`;
  return frame(`${v.region} ${v.name}`, `
    <div class="h2" style="margin-bottom:10px">${c.r ? '바꿀 날짜를 골라 주세요' : '언제 머무를까요?'}<small>취소선이 있는 날은 예약할 수 없어요.${BLOCKS.some(x => x.villa === c.v && x.out > 0) ? ` ${BLOCKS.filter(x => x.villa === c.v && x.out > 0).map(x => `${md(x.in)} – ${md(x.out)} ${x.reason}`).join(', ')} 기간이 포함돼요.` : ''}</small></div>
    ${monthGrid(c)}
    <div class="guests"><div><b style="font-size:16px">인원</b><div class="mut" style="font-size:14px">최대 ${v.cap}인</div></div><span class="stepper"><button data-g="-1">−</button><span>${c.g}</span><button data-g="1">+</button></span></div>`,
    `<div class="cta"><div class="note">${note}</div><button class="btn primary" data-book ${ok ? '' : 'disabled style="opacity:.35"'}>${c.r ? '이 날짜로 바꾸기' : n ? `${n}박 예약하기` : '예약하기'}</button></div>`);
}
function sDone(){
  const r = R[cur().idx];
  return frame(null, `<div class="fin">${ICON.check}<h2>${cur().changed ? '일정을 바꿨어요' : '예약했어요'}</h2><p>${vFull(r.villa)}<br>${mdw(r.in)} – ${mdw(r.out)} · ${r.out - r.in}박</p><p style="margin-top:14px;color:var(--ink-3);font-size:14px">회사 숙박권 잔여 ${leftNow()}박</p></div>`,
    `<div class="cta"><div class="two" style="margin:0"><button class="btn" data-tab="home">홈으로</button><button class="btn primary" data-tab="my">내 예약 보기</button></div></div>`);
}
function sMy(){
  const c = cur(), f = c.f || '예정';
  const L = MY().filter(r => f === '예정' ? ['예정','이용 중'].includes(cst(r)) : cst(r) === f).sort((a, b) => f === '예정' ? a.in - b.in : b.in - a.in);
  return frame('내 예약', `
    <div class="seg2">${['예정','완료','취소'].map(x => `<button data-f="${x}" class="${f === x ? 'on' : ''}">${x} ${MY().filter(r => x === '예정' ? ['예정','이용 중'].includes(cst(r)) : cst(r) === x).length}</button>`).join('')}</div>
    ${L.length ? L.map(r => `<button class="row" data-open="${r.idx}"><span class="thumb" style="${IMG(r.villa)}"></span><span class="tx"><b>${vFull(r.villa)}</b><small>${mdw(r.in)} – ${mdw(r.out)} · ${r.out - r.in}박</small><small>${r.corp ? '회사 숙박권' : '개인 결제'}${cst(r) === '취소' ? ' · 숙박권 반환됨' : ''}</small></span><span class="chev">${ICON.chev}</span></button>`).join('')
      : `<div class="mut" style="text-align:center;padding:60px 0">${f} 예약이 없어요.</div>`}`, '', true);
}
function sOpen(){
  const r = R[cur().idx], s = cst(r), canEdit = s === '예정', perm = state() === '이용 가능';
  return frame('예약 상세', `
    <div class="thumb" style="${IMG(r.villa)};width:100%;height:170px;border-radius:20px"></div>
    <div class="h2" style="margin-top:16px">${vFull(r.villa)}<small>${s === '취소' ? '취소된 예약이에요' : s === '완료' ? '이용을 마친 예약이에요' : `${r.in === 1 ? '내일' : `${r.in}일 뒤`} 체크인이에요`}</small></div>
    <div class="kv2">
      <div><span>체크인</span><b>${mdw(r.in)} 15:00</b></div>
      <div><span>체크아웃</span><b>${mdw(r.out)} 11:00</b></div>
      <div><span>인원</span><b>성인 ${r.adults}${r.kids ? ` · 아동 ${r.kids}` : ''}</b></div>
      <div><span>결제</span><b>${COMPANY.name} 숙박권 ${r.out - r.in}박</b></div>
      <div><span>예약번호</span><b class="num" style="color:var(--ink-3);font-weight:500">${r.id}</b></div>
    </div>
    ${canEdit ? `<div class="two"><button class="btn" data-change ${perm ? '' : 'disabled style="opacity:.4"'}>일정 변경</button><button class="btn danger-weak" data-cancel>예약 취소</button></div>
      ${perm ? '' : '<div class="mut" style="font-size:14px;margin-top:10px">이용 권한이 꺼져 있어 일정 변경은 할 수 없어요. 취소는 할 수 있어요.</div>'}` : ''}`);
}

function draw(){
  const s = cur().s;
  $('scr').innerHTML = {home:sHome, affil:sAffil, villas:sVillas, dates:sDates, done:sDone, my:sMy, open:sOpen}[s]();
  side();
}
function ptoast(m){ const t = document.createElement('div'); t.className = 'ptoast'; t.innerHTML = ICON.check + `<span>${m}</span>`; $('scr').appendChild(t); setTimeout(() => t.remove(), 2200); }
function sheet(title, text, okLb, onOk){
  const d = document.createElement('div'); d.className = 'shscrim';
  d.innerHTML = `<div class="sheet"><h3>${title}</h3><p>${text}</p><div class="two"><button class="btn" data-x>닫기</button><button class="btn danger" data-y>${okLb}</button></div></div>`;
  d.onclick = e => { if (e.target === d || e.target.closest('[data-x]')) d.remove(); if (e.target.closest('[data-y]')){ d.remove(); onOk(); } };
  $('scr').appendChild(d);
}

$('scr').addEventListener('click', e => {
  const t = e.target, c = cur();
  if (t.closest('[data-back]')) return pop();
  const tb = t.closest('[data-tab]'); if (tb){ if (tb.dataset.tab === 'mypage') return ptoast('마이 화면은 준비 중이에요'); stack = [{s:tb.dataset.tab}]; return draw(); }
  const g = t.closest('[data-go]'); if (g) return push({s:g.dataset.go});
  const v = t.closest('[data-v]'); if (v){
    if (state() !== '이용 가능') return ptoast('개인 결제 예약 화면은 이 시안에 없어요');
    return push({s:'dates', v:v.dataset.v, m:0, g:2});
  }
  const rg = t.closest('[data-rg]'); if (rg){ c.rg = rg.dataset.rg; return draw(); }
  if (t.closest('[data-code]') && mailOk(c)){ c.sent = true; return draw(); }
  if (t.closest('[data-req]')){ if (!c.sent || !mailOk(c)) return; requestAffil(me()); home(); return ptoast('확인을 요청했어요. 인사팀이 확인하면 알려드릴게요'); }
  const m = t.closest('[data-m]'); if (m && !m.disabled){ c.m += +m.dataset.m; return draw(); }
  const d = t.closest('[data-d]'); if (d && !d.disabled){
    const o = +d.dataset.d;
    if (c.a == null || c.b != null || o <= c.a){ if (booked(c.v, o, c.r)) return; c.a = o; c.b = null; } else c.b = o;
    return draw();
  }
  const gg = t.closest('[data-g]'); if (gg){ c.g = Math.min(vById[c.v].cap, Math.max(1, c.g + +gg.dataset.g)); return draw(); }
  if (t.closest('[data-book]')){
    if (!rangeOk(c)) return;
    if (c.r){ const r = c.r; const before = `${md(r.in)} – ${md(r.out)}`; r.in = c.a; r.out = c.b; r.adults = c.g; log(r, `일정 변경 · ${before} → ${md(r.in)} – ${md(r.out)} (직원 앱)`); save(r); stack = [{s:'my'}]; return push({s:'done', idx:r.idx, changed:true}); }
    const emp = empOf(who);
    const r = bookCorp(emp, c.v, c.a, c.b, c.g);
    stack = [{s:'home'}]; return push({s:'done', idx:r.idx});
  }
  const f = t.closest('[data-f]'); if (f){ c.f = f.dataset.f; return draw(); }
  const op = t.closest('[data-open]'); if (op) return push({s:'open', idx:+op.dataset.open});
  if (t.closest('[data-change]') && !t.closest('[data-change]').disabled){ const r = R[c.idx]; return push({s:'dates', v:r.villa, m:r.in > 34 ? 1 : 0, g:r.adults, r, a:r.in, b:r.out}); }
  if (t.closest('[data-cancel]')){ const r = R[c.idx];
    return sheet('예약을 취소할까요?', `${vFull(r.villa)} ${mdw(r.in)} – ${mdw(r.out)} 예약이 취소되고, 숙박권 ${r.out - r.in}박이 회사 잔여로 돌아가요.`, '예약 취소', () => { r.base = '취소'; r.pay = '환불완료'; log(r, '직원 앱에서 예약 취소 · 숙박권 반환'); save(r); pop(); ptoast(`취소했어요. 숙박권 ${r.out - r.in}박이 돌아갔어요`); }); }
});
{ const PR = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(x => { const [k, ...v] = x.split('='); return [k, decodeURIComponent(v.join('='))]; }));
  if (PR.p != null) who = PERSONAS[+PR.p].email;
  if (PR.left != null) OVR.left = +PR.left;
  if (PR.state === 'off') OVR.state = '권한 없음';
  const i = PR.i != null ? +PR.i : null;
  switch (PR.s){
    case 'villas': stack.push({s:'villas'}); break;
    case 'dates': stack.push({s:'villas'}, {s:'dates', v:PR.v || 'v7', m:0, g:2, a:PR.a != null ? +PR.a : null, b:PR.b != null ? +PR.b : null}); break;
    case 'done': { const r = MY().filter(x => cst(x) === '예정').sort((a, b) => a.in - b.in)[0]; if (r) stack.push({s:'done', idx:r.idx}); break; }
    case 'my': stack = [{s:'my'}]; break;
    case 'open': stack = [{s:'my'}, {s:'open', idx:i}]; break;
    case 'change': { const r = R[i]; stack = [{s:'my'}, {s:'open', idx:i}, {s:'dates', v:r.villa, m:r.in > 34 ? 1 : 0, g:r.adults, r, a:r.in, b:r.out}]; break; }
    case 'cancel': stack = [{s:'my'}, {s:'open', idx:i}]; setTimeout(() => $('scr').querySelector('[data-cancel]')?.click(), 60); break;
    case 'affil': stack.push({s:'affil', sent:!PR.mail, mail:PR.mail}); break;
  }
}
draw();
</script>
</body>
</html>
